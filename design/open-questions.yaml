# Design decisions and open questions. Shown on the "Open Questions" sheet of the spreadsheet.
# status: open | decided | parked
questions:
  - id: Q1
    status: decided
    question: What is the theme of the colorless common cycle (5 cards, replacing the original vanilla-4 cycle)?
    notes: |
      Decided: each colorless common is worth 5 and can only be played if you have a mood of one specific color
      (one card per color; e.g. the white one reads "You can only play this card if you have a white mood").
      Revised from value 4: a gated colorless 4 was strictly worse than the original colored vanilla 4s with no upside, so the
      value rose to 5 together with the own-moods gate (Q7). Fall back to 4 if playtests show 5 is too strong.
      Slots X-C01..X-C05 (white, blue, black, red, green).
      Still to settle when designing the cards: whether "there is a [color] mood" counts any player's moods or only yours
      (decided in Q7: only your own moods count), and whether any of the five needs a small upside or drawback after playtesting.
  - id: Q2
    status: decided
    question: Colorless distribution - 5 commons + 2 uncommons + 1 rare (8 of 133)?
    notes: "Decided: 8 of 133 is fine for now."
  - id: Q3
    status: open
    question: Which original-pool cards (max 13 of 133) are worth reprinting?
    notes: |
      Probable reprints (role-player commons), pre-assigned to the slot whose role each fits; the Set sheet shows them in the
      "Reprint candidate" column. Not final: Pacifism (W-C03), Panic (U-C03), Fear (U-C04), Ambition (B-C04), Hate (B-C05),
      Suspicion (B-C07), Shock (R-C03), Bravado (R-C04), Zeal (R-C05), Compulsion (R-C07), Joy (G-C04), Nostalgia (G-C05),
      Determination (G-C06). That is 13, exactly the cap (13 of 133 = 9.8%), so any further reprint means dropping one of these.
      A candidate becomes a reprint when a card file with reprint_of is added.
  - id: Q4
    status: decided
    question: Should the ally/enemy wheel (10 commons) be kept as-is, reskinned, or replaced?
    notes: |
      Decided: replace it. Keep the 10-card structure (per color, one "ally" card and one "enemy" card), but the new cards care about
      2+ moods of the adjacent (ally) or opposing (enemy) colors for a different effect rather than swapping the card's own
      value between 3 and 6. Slots C01 (ally-count) and C02 (enemy-count) in each color. Colorless moods count as neither.
      The specific effects are to be designed.
  - id: Q5
    status: open
    question: Which mythic build-around axes does each color get?
    notes: |
      Decided structure: each color keeps one mythic slot dedicated to a build-around (M01, so 5 in the set, matching the original
      pool's 5) and the other two (M02, M03) are flexible, so they need not be build-arounds. The axes themselves are still to be
      determined, so this question stays open. The mythics will likely shape the direction of the rest of the set, so the other rare/uncommon slot
      roles may be revised once they exist. The original pool has 5 build-around mythics (Validation, Exhilaration, Bliss,
      Duplicity, Thrill), each with about 14 partners.
      Red axis (tentative): playing red moods, led by Dominance in R-M01 (each time you play another red mood, remove a lower-value
      opposing mood). Partners would be high-value red moods, red extra-play grants and red play-triggered effects.
      Contributor discussion (the flexible slots above follow from this; the Complexity / Power Ratio reading of rarity is still
      only proposed): not every mythic has to be a build-around. How easy a card is to
      build around is a sliding scale. Guile, Chaos, Malice, Exhilaration and Sneakiness have no obvious plan, while rares such as
      Grief, Rationalization, Regret, Grace, Wrath and Pride need a dedicated deck to reach full power. Rarity is better read
      as Complexity (more words, higher rarity) plus Power Ratio (a card's average value over the ~5 turns of a game,
      combining its value with how often it gets that value).
  - id: Q6
    status: decided
    question: How are new cards implemented in the simulator?
    notes: |
      Decided: simulator changes (e.g. a colorless color value, play restrictions based on colors in play) will be handled
      separately. For design purposes a mechanic only has to be implementable in principle; mark cards that would need a
      new engine primitive with impl_tier 2 (see design/card-schema.md).
  - id: Q7
    status: decided
    question: Does a colorless gate ("a white mood in play") count moods of any player, or only your own?
    notes: |
      Original-pool precedent for board-wide wording is "there is a ... mood" (any player), e.g. Love and Happiness.
      Counting any player's moods makes the colorless commons easier to enable but also lets opponents turn them off.
      Decided first: any player's moods count ("there is a white mood").
      Revised (final): only your own moods count ("if you have a white mood"), together with raising the value from 4 to 5 (Q1).
      Reasons: a gated colorless 4 was strictly worse than the old colored vanilla 4s; counting only your moods makes the gate a real
      cost that justifies the higher value, stops opponents from switching the cards off, and makes the cycle a color-commitment
      signal. Cost: an opponent's board no longer enables your gate cards, and they cannot be your first play.
      Decided: a suppressed mood still counts as a mood of its color, so it satisfies the gate.
  - id: Q8
    status: open
    question: For the black mythic idea Coercion (hand-reveal-or-lose-a-mood), should targeting be restricted and should the opponent choose?
    notes: |
      Two knobs, to be settled by playtesting (cards/coercion-restricted.yaml and cards/coercion-unrestricted.yaml):
      1. Targeting. Restricted = the target must have one or more cards in hand and one or more moods, so the card gets no value
         from an empty hand or empty board (power and reliability are inversely correlated, a common Mood Swings theme; the card is
         held until an opponent commits to the board). Unrestricted = any opponent, and an opponent with an empty hand cannot decline.
      2. Opponent choice. The drafted text lets the opponent choose between revealing their hand (you take a card and may play it as
         an additional mood) and putting one of their highest value moods into the discard pile. A contributor variant where the
         opponent does not choose is not written up yet (either you pick the branch, or both happen).
      Hybrids are possible. Sensible one: require only that the target has one or more moods (an empty hand then forces the
      mood loss, an empty board cannot be hit). The reverse (require only cards in hand) is poor, because an opponent with no
      moods can decline for free and the card does nothing.
      Placement: tentatively black flexible mythic slot B-M02; the restricted file holds the slot for now.
      Concern raised: restricted may be too weak, unrestricted too strong; no consensus without playtesting.
