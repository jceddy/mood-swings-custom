# Design decisions and open questions. Shown on the "Open Questions" sheet of the spreadsheet.
# status: open | decided | parked
questions:
  - id: Q1
    status: decided
    question: What is the theme of the colorless common cycle (5 cards, replacing the original vanilla-4 cycle)?
    notes: |
      Decided: each colorless common is worth 5 and can only be played if you have a mood of one specific color
      (one card per color; e.g. the white one reads "You can only play this card if you have a white mood").
      Revised from value 4: a gated colorless 4 was strictly worse than the original colored vanilla 4s with no upside, so the
      value rose to 5 together with the own-moods gate (Q7). Fall back to 4 if playtests show 5 is too strong.
      Slots X-C01..X-C05 (white, blue, black, red, green).
      Still to settle when designing the cards: whether "there is a [color] mood" counts any player's moods or only yours
      (decided in Q7: only your own moods count), and whether any of the five needs a small upside or drawback after playtesting.
  - id: Q2
    status: decided
    question: Colorless distribution - 5 commons + 2 uncommons + 1 mythic (8 of 133)?
    notes: |
      Decided: 8 of 133 is fine for now. The single top-rarity colorless slot was a rare (X-R01) and became a mythic (X-M01) when
      Unity, a win-the-round effect with no equal in the original pool, was placed there: the count stays 8, only the split changes,
      so the set's totals become 45 common, 42 uncommon, 30 rare and 16 mythic. There is no colorless rare.
  - id: Q3
    status: decided
    question: Which original-pool cards (max 13 of 133) are worth reprinting?
    notes: |
      Decided: 13 reprints (13 of 133 = 9.77%, exactly the cap), role-player commons pre-assigned to the slot whose role each
      fits; the Set sheet shows them in the "Reprint candidate" column: Pacifism (W-C03), Panic (U-C03), Fear (U-C04), Ambition
      (B-C04), Hate (B-C05), Suspicion (B-C07), Shock (R-C03), Bravado (R-C04), Zeal (R-C05), Compulsion (R-C07), Joy (G-C04),
      Nostalgia (G-C05), Determination (G-C06). Later change (Q10): Ambition and Bravado were replaced by two new cards, Remorse and
      Rashness, so the set now has 11 reprints (11 of 133 = 8.27%) and the other 11 files are final. Nostalgia was dropped for a while because it seemed to overlap Warmth (G-C01), then
      reinstated: a contributor pointed out that they are different roles (Nostalgia is a 0-value acceleration card with a pickup
      attached; Warmth is a conditional pickup on a 3-value body). With 13 the list has no headroom, so any further reprint means
      dropping one.
      A candidate becomes a reprint when a card file with reprint_of is added: all 13 files are written (status draft), with the text
      copied from the baseline. The baseline may be missing printed reminder text, so each should be checked against the printed card
      before it is marked final.
  - id: Q4
    status: decided
    question: Should the ally/enemy wheel (10 commons) be kept as-is, reskinned, or replaced?
    notes: |
      Decided: replace it. Keep the 10-card structure (per color, one "ally" card and one "enemy" card), but the new cards care about
      2+ moods of the adjacent (ally) or opposing (enemy) colors for a different effect rather than swapping the card's own
      value between 3 and 6. Slots C01 (ally-count) and C02 (enemy-count) in each color. Colorless moods count as neither.
      The specific effects are to be designed.
  - id: Q5
    status: open
    question: Which mythic build-around axes does each color get?
    notes: |
      Decided structure: each color keeps one mythic slot dedicated to a build-around (M01, so 5 in the set, matching the original
      pool's 5) and the other two (M02, M03) are flexible, so they need not be build-arounds. The axes themselves are still to be
      determined, so this question stays open. The mythics will likely shape the direction of the rest of the set, so the other rare/uncommon slot
      roles may be revised once they exist. The original pool has 5 build-around mythics (Validation, Exhilaration, Bliss,
      Duplicity, Thrill), each with about 14 partners.
      Red axis (tentative): playing red moods, led by Dominance in R-M01 (each time you play another red mood, remove a lower-value
      opposing mood). Partners would be high-value red moods, red extra-play grants and red play-triggered effects.
      Green axis (tentative): replaying from the discard pile and re-triggering after-playing effects, led by Reinvigoration in G-M01
      (put your other moods into the discard pile, then replay that many from the whole pile; no other plays that turn). Partners would
      be cheap moods with strong after-playing effects and discard-pile cards like Grace.
      Blue axis (tentative): recycling the discard pile and playing many moods, led by Reverie in U-M01 (each time you play another
      mood, put a discard-pile card on the bottom of the deck and draw a card). Partners would be discard-pile fuel and extra-play
      cards.
      White axis (tentative): numbers, meaning printed values and parity (about 20 pool cards already care: Courage, Dignity,
      Friendliness, Kindness, Repentance, Meekness, Validation, Encouragement, Idealism in white; Shock, Rage, Anger, Hostility,
      Rebellion, Spite, Anxiety, Cheer, Delight, Embarrassment, Denial, Rejection, Worry elsewhere). W-M02 (Restraint) cuts extra
      plays, so W-M01 should reward caring about values rather than being a play-grant engine. The mythic is Orderliness (choose odd or even
      numbers; each of your other moods with a chosen number in its top right corner gets +1).
      Black axis (tentative): hand pressure, meaning hand size and hand attacks (about 19 pool cards already touch hands, plus our
      Entitlement, Schadenfreude, FOMO, Yearning, Rapport, Premonition, Wariness). Chosen over a black discard-pile axis because blue (recycle)
      and green (replay) already use the discard pile; this keeps the five axes distinct (numbers, hand pressure, playing red moods,
      replaying from the pile, recycling the pile). The mythic is Neglect (value 2; before scoring, each opponent with no cards in their hand puts one of their highest value moods into
      the discard pile). Hand sizes are public, so hand-size payoffs are also possible.
      Contributor discussion (the flexible slots above follow from this; the Complexity / Power Ratio reading of rarity is still
      only proposed): not every mythic has to be a build-around. How easy a card is to
      build around is a sliding scale. Guile, Chaos, Malice, Exhilaration and Sneakiness have no obvious plan, while rares such as
      Grief, Rationalization, Regret, Grace, Wrath and Pride need a dedicated deck to reach full power. Rarity is better read
      as Complexity (more words, higher rarity) plus Power Ratio (a card's average value over the ~5 turns of a game,
      combining its value with how often it gets that value).
  - id: Q6
    status: decided
    question: How are new cards implemented in the simulator?
    notes: |
      Decided: simulator changes (e.g. a colorless color value, play restrictions based on colors in play) will be handled
      separately. For design purposes a mechanic only has to be implementable in principle; mark cards that would need a
      new engine primitive with impl_tier 2 (see design/card-schema.md).
  - id: Q7
    status: decided
    question: Does a colorless gate ("a white mood in play") count moods of any player, or only your own?
    notes: |
      Original-pool precedent for board-wide wording is "there is a ... mood" (any player), e.g. Love and Happiness.
      Counting any player's moods makes the colorless commons easier to enable but also lets opponents turn them off.
      Decided first: any player's moods count ("there is a white mood").
      Revised (final): only your own moods count ("if you have a white mood"), together with raising the value from 4 to 5 (Q1).
      Reasons: a gated colorless 4 was strictly worse than the old colored vanilla 4s; counting only your moods makes the gate a real
      cost that justifies the higher value, stops opponents from switching the cards off, and makes the cycle a color-commitment
      signal. Cost: an opponent's board no longer enables your gate cards, and they cannot be your first play.
      Decided: a suppressed mood still counts as a mood of its color, so it satisfies the gate.
  - id: Q8
    status: open
    question: For the black mythic idea Entitlement (hand-reveal-or-lose-a-mood), should targeting be restricted and should the opponent choose?
    notes: |
      Two knobs, to be settled by playtesting (cards/coercion-restricted.yaml and cards/coercion-unrestricted.yaml):
      1. Targeting. Restricted = the target must have one or more cards in hand and one or more moods, so the card gets no value
         from an empty hand or empty board (power and reliability are inversely correlated, a common Mood Swings theme; the card is
         held until an opponent commits to the board). Unrestricted = any opponent, and an opponent with an empty hand cannot decline.
      2. Opponent choice. The drafted text lets the opponent choose between revealing their hand (you take a card and may play it as
         an additional mood) and putting one of their highest value moods into the discard pile. A contributor variant where the
         opponent does not choose is not written up yet (either you pick the branch, or both happen).
      Hybrids are possible. Sensible one: require only that the target has one or more moods (an empty hand then forces the
      mood loss, an empty board cannot be hit). The reverse (require only cards in hand) is poor, because an opponent with no
      moods can decline for free and the card does nothing.
      Placement: tentatively black flexible mythic slot B-M02; the restricted file holds the slot for now.
      Concern raised: restricted may be too weak, unrestricted too strong; no consensus without playtesting.
  - id: Q9
    status: open
    question: Which cards need a playtest check given that moods stay in play across rounds and hands refill only through round losses and card effects?
    notes: |
      Moods stay in play after a round is scored, the losing players draw a card at the end of each round (no draw each turn), and each
      player has one turn per round, so boards grow by about one mood per round.
      Five checks follow from that:
      1. Colorless gate commons (value 5): the own-mood gate is paid once, then free for the rest of the game, so check 5 against 4.
      2. Reinvigoration: it scales with board size and can replay a whole board (boards grow about one mood per round), so check whether it
         needs a cap (for example "up to three").
      3. Reverie: it draws on entry and on each later play (about one per round without extra plays, more with them), so check
         whether it needs "once each turn".
      4. Entitlement (restricted and unrestricted): hands are often small or empty, so the restricted version fizzles more and the
         unrestricted one forces more mood losses (see Q8).
      5. FOMO (value 7): paying a card every round drains the hand quickly, so check whether the mood is discarded too soon for 7 to be fair.
      Ruling and balance watch items from the rares and uncommons written since:
      - Admiration: what "this mood" means when the copied pile mood refers to itself (proposed: the mood you just played).
      - Covetousness: a free extra mood every round, so check whether it needs a value of 0 only.
      - Shrewdness: it may be strong against opposing engines now that it only needs a lower or equal value, so check whether to restore the same-value condition or require matching printed values.
      - Reassurance: it protects cheap engines from targeted effects (Shrewdness, Covetousness), so check whether a threshold of 1 is fairer.
      - Overconfidence: three plays in one turn, then none, so check the burst against Dominance and Verve decks.
      - Pettiness: a skipped turn for one card, so check whether it needs two cards or a block on the first play only.
      - Rudeness (rare): it blanks one full turn for every other player, so check the strength against a combo turn; the fallback is to hit only a chosen player.
      - Free-play cycle (Fear, Nostalgia, Levity, Remorse, Rashness): five unconditional free extra plays at common, so check how strong extra-play engines get, and whether Rashness needs "a value of 0" only.
      - Levelheadedness: every mood scores 2 for a round, so check the swing; the fallback is a cap of 3 per mood.
      - Affinity: another free-play enabler for decks with duplicate numbers; the once-a-turn cap is the safety.
      - Elusiveness: opponents' removal becomes a bounce, so check it against combo decks; the fallback is to bounce only moods with a value of 3 or less.
      - Opportunism: it turns discard costs into your cards, so check it against FOMO and Suspicion decks; the fallback is the first card each turn.
      - Volatility: random removal of moods with a value of 1 or less hits your own cheap moods too; the fallback is opponents' moods only.
      - Wastefulness: with Resilience or Thrift it is free plays from the top of the deck, which is card advantage.
      - Maturity: it prints 2 and grows by 2 each round (2, 4, 6, 8), so check it is not too strong when left alone, and that opponents have time to remove it; counters on paper; the fallback is to grow by 1.
      - Carelessness: it removes two random cards from the deck for pile fuel, so check it is not too weak; the fallback is one card.
      - Gratitude: it needs moods with a current value of 1 or 2 to do anything (the group kept the current-value version over the printed-number one), so check it against wide boards; the fallback is a value of 3 or less.
      - Honesty: showing the hand once may matter more in paper than in digital, and colorless cards in hand make it false.
      - Vitality: +2 to every mood of a chosen color each round, including moods played later that round (Q12, decided), is very strong in mono-color decks; the fallback is +1.
      - Neglect: a first playtest found the old version (a 0, at the start of your turn, the opponent chooses the mood) far too weak; it is now a 2 that triggers before scoring and removes a highest value mood. The open worry is that an empty hand is still hard to get without hand disruption; the next steps are "each opponent discards a card from their hand; if they can't, they put one of their highest value moods into the discard pile" or a threshold of two or fewer cards.
      - Candor: a face-up hand for the whole game may feel oppressive in paper, and the information may matter little against decks that ignore hands.
      - Replacement ordering (Elusiveness and Grudge, and any other pair that applies to one event): decided. Triggers and replacement effects are applied starting with the active player and then player by player in turn order (the simulator already resolves after-scoring effects per controller in turn order). When one player controls more than one applying effect, which is the usual case for Elusiveness and Grudge, that player chooses the order.
      - Perseverance: it grows by 2 after scoring while you have won fewer rounds than each other player, on top of the card losers draw and Hurt Feelings, so check that falling behind does not become attractive and that it is not too strong at match point (2, 4, 6 in a 2-player game); the fallbacks are a growth of 1 or a value of 1.
      - Fulfillment: each mood worth 6 or more scores twice, so three conditional moods at 6 can run away; the fallbacks are a threshold of 7 or scoring only one such mood an extra time.
      - Inspiration: a free card of your choice from the top three cards, played from the hand; it is close to Nostalgia, so check it does not feel like a narrower Nostalgia at mythic rarity; the fallbacks are the unrestricted extra play, revealing four cards, or playing up to two of the three (or revealing two cards if it is too strong).
      - Ardor: a quadratic payoff for red moods that may snowball; the fallback is a cap such as "up to three".
      - Competitiveness: always one more than the biggest opposing mood that does not have this ability (two of them would otherwise read each other forever), so check its volatility; the fallback is "equal to" instead of 1 more, keeping the exclusion.
      - Grudge: up to two extra plays each turn when the chosen opponent has 2 round wins, so check the burst against the free-play cycle, Haunting and Affinity; check its replacement effect with Elusiveness.
      - Hellbent: the round leader runs their hand dry first (losers draw at the end of a round), so it favors the leader; check the snowball, with an alternate value of 6 as the fallback.
      - Haunting: the burst size next turn with a big pile and a big hand, since each play triggers play engines; it was found too strong at value 2, so it now prints 0 and the plays are kept only if you still have it at the start of your next turn; check it is still playable when opponents can remove it, and the fallback is "up to three".
      - Levity: a free play that enables extra-play engines, so check the fallback of choosing between cycling and the extra play.
      - Defensiveness: it strips the after-playing effects of opponents' additional moods and spares you, so check it is not dead against decks without extra plays and whether it needs to be symmetric.
      - Rancor: mandatory and random, so nobody is prompted; check that a random pick among moods with a value of 3 or less is not too harsh on cheap engines (fallback: a value of 1 or less), and that the simulator can tell which player controls an effect.
      - Heartlessness: it also hits your own board, so check it works when you are behind.
      - Sentimentality: check that it does not break the draw rule with a sacrifice engine such as Martyrdom.
      - Intuition (1 point) and Belligerence (2 points) were lowered after group feedback, so check they are still worth playing.
  - id: Q10
    status: decided
    question: Should every color have a zero-point common with a small effect and an unconditional extra play?
    notes: |
      Decided: yes. Fear (blue) and Nostalgia (green) are reprints from the original pool and Charity (white) was the original free
      play; the set completes the cycle with Levity (white, a submission from Dr Potato: put this mood on the bottom of the deck to
      draw a card), Remorse (black: a card from the discard pile to the bottom of the deck, then draw a card) and Rashness (red: remove
      an opponent's mood with a value of 1 or less). Remorse replaced the reprint Ambition (B-C04) and Rashness replaced the reprint
      Bravado (R-C04), so the reprint count dropped from 13 to 11 (Q3). The red card uses opponents' moods only; the original proposal
      said "a mood". Playtest watch items are listed in Q9.
  - id: Q11
    status: decided
    question: What is the set called, and what is its set code?
    notes: |
      Decided for now: Emotional Baggage, code XEMB. The name fits the set's recurring themes: moods stay in play all game, hands are
      scarce, many effects replay or force the discard pile, and many card names are carried feelings (Grudge, Remorse, Grievance,
      Rancor, Despair, Sentimentality, Nostalgia). The group is still discussing it, so it may change; the name and code live in
      design/skeleton.yaml (set name and code) and in the MSE template's default set code.
      Set code convention: an X followed by a three-letter abbreviation, so a community set cannot be mistaken for, or collide
      with, a later official set. A four-letter code can never equal a three-letter one such as the original MSW, and an X
      is rare as the first letter of an official abbreviation. The simulator's sets table (MoodSwings-Web, migration 0015) allows
      codes of up to 10 characters and requires both the code and the set name to be unique (name up to 60 characters), and card
      images live in a folder named after the code, so keep it uppercase letters only.
      Other names considered: Mood Board (XMBD), Mixed Feelings (XMXF), Afterglow (XAFG), Highs and Lows (XHAL), Temperaments (XTMP).
  - id: Q12
    status: decided
    question: Does Vitality's boost apply to moods of the chosen color that are played after it triggers?
    notes: |
      Decided: yes, which was the original intent. The rules text is unchanged and a reminder says so: "Until the end of this round, each of your moods of that
      color has its value increased by 2. (This includes moods you play later this round.)" Vitality triggers at the start of your turn,
      you choose a color, and each of your moods of that color gets +2 until the end of the round, even if Vitality leaves play (ruling),
      whenever it was played. So the digital implementation applies the boost to every mood of the chosen color you control at
      scoring time, including ones played after the trigger (it first did not, while the group was still discussing it).
      That is the stronger reading: it rewards extra plays and playing into the chosen color. Check it in playtests (see the
      Vitality items in Q9 and the playtest checklist); the fallback is +1 instead of +2.
  - id: Q13
    status: open
    question: Should Ardor, Possessiveness and Grudge change after the first round of play tests (sessions 1 to 2f, games 490 to 545)? The group is discussing this; nothing is decided and no card file has been changed.
    notes: |
      A first pass over the play test results (design/playtest-results.md) found three changes with medium confidence. They are
      proposals for the group to pick from; if the group decides, apply the chosen text in the card file with the reason in its
      notes and move the question to decided. The sample sizes are small (a handful of games per deck), so each item also says
      what would change the picture.

      1. Ardor (R-M02, mythic, value 0). Evidence: 19 points with three red moods (game 534 round 3), 22 with four (536 round 3), 28 with
         four (534 round 4), 35 with four plus Kinship (535 round 5) and 40 with five (534 round 5); the highest scores of the play tests.
         It was in play in four of the six G against R games and R won three of them; it also reached 27 against B (game 526). The payoff
         is quadratic (each red mood gets +N), so rounds 3 to 5 decide the game. The sweet spot is a mild change that keeps the shape.
         Option A (preferred): count only the other red moods.
           Before: While in play — Each of your red moods has its value increased by the number of red moods you have.
           After:  While in play — Each of your red moods has its value increased by the number of other red moods you have.
           ("Other" means other than Ardor; with four red moods including Ardor each red mood gets +3 instead of +4, about N points less.)
         Option B (stronger): one for every two red moods (rounded down), or the existing Q9 fallback of a cap such as "up to three".
         What would change it: R decks that struggle against B (it won 1 of 4 games against B, session 2b) suggest leaving it alone.

      2. Possessiveness (G-U05, uncommon, 0 or 6). Evidence: in the games checked (533 to 545) the discard pile held at most three cards at the end
         of every game, so it was never a 6 at the five-card threshold. Wastefulness, its
         fuel, was never played (G gave it to Compulsion twice and held it at the end of three games), and Carelessness milled
         the deck's own key cards (Possessiveness and Determination in game 535, Urgency and Maturity in 536, Urgency and Kinship in 540).
         Option A (preferred): lower the threshold from five cards to three.
           Before: While in play — This mood's value is 6 if there are five or more cards in the discard pile.
           After:  While in play — This mood's value is 6 if there are three or more cards in the discard pile.
         Option B: four cards (a smaller change).
         What would change it: a game where the pile fills past three early (for example with Haunting or FOMO discards).

      3. Grudge (W-M03, mythic, value 0). Evidence: its extra plays went unused because the hand was empty: 7 of the 19 extra plays it
         granted over games 527 to 545 were used, and every unused one came with no cards in hand (W passed or ran out in the later rounds of games 527,
         530, 531, 542 and 543). Played as a first play it is a dead 0 (games 528 and 530). The problem is cards, not the rules: the
         extra plays need fuel. A plain "draw a card" was considered and rejected because a draw can deck a player out (a draft deck has 12
         cards), so the variations avoid drawing from the deck.
         Current text: After playing this mood — Choose an opponent. While in play — During each of your turns (including the turn you play
         this mood), you may play an additional mood for each round the chosen player has won. While in play — If this mood would leave play,
         put it on the bottom of the deck instead. (Leaving play includes being put into the discard pile or into a player's hand.)
         Variation A (preferred, no new effect needed; Nostalgia and Reminiscence already use this wording): refill from the shared discard pile.
           After:  After playing this mood — Choose an opponent. You may put a card from the discard pile into your hand. While in play — ... (the rest unchanged)
           Weakness: the shared pile is small (one to three cards by round 3 or 4), so it refuels by one card at most.
         Variation B (stronger, needs a grant that can use the discard pile, as Thrift does): the extra plays may come from the discard pile.
           After:  After playing this mood — Choose an opponent. While in play — During each of your turns (including the turn you play this mood), you may play an additional mood for each round the chosen player has won. You may play it from the discard pile. While in play — ... (the rest unchanged)
           Risk: W can play an opponent's removal from the pile (for example B's Shock or Vengeance); test A first.
         Variation C (fixes the dead first play, not the empty hand): raise the printed value from 0 to 2 and leave the text alone.
         Variations A and C together are the smallest safe package.
         Rejected: "After playing this mood — Draw a card." (deck-out risk).
         What would change it: a W deck with real card flow (more Discernment-style loots) would not need any of these.

      Lower confidence, listed for reference (also in Q9): Vitality +2 to +1 if the Vitality and Fulfillment pair repeats (game 541 scored 22
      and 27 from four moods); Rudeness 1 to 3 (it was held or cycled away in every game it was drawn); Confidence widened to "3, 4, 5 or 6"
      (its 4-to-6 extra play was used in about two of five W plays); Dominance is a watch item, not a change (it removed two of G's
      moods in game 537, but a once-per-turn cap would not have changed what happened).
