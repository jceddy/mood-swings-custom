name: Release

# Pushing a tag such as v0.1.0 builds the current-state spreadsheet and publishes a GitHub release with it.
# The release notes are design/release-notes.md plus a snapshot line from the build.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the spreadsheet
        run: |
          pip install -r requirements.txt
          python scripts/build_xlsx.py mood-swings-custom-set.xlsx | tee build.log
          grep -q ", 0 problem(s)" build.log   # stop the release if a rule check fails
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Snapshot at $GITHUB_REF_NAME: $(head -n 1 build.log | sed 's/^wrote [^:]*: //')."
            echo
            cat design/release-notes.md
          } > notes.md
          gh release create "$GITHUB_REF_NAME" mood-swings-custom-set.xlsx \
            --title "Custom set snapshot $GITHUB_REF_NAME" \
            --notes-file notes.md
