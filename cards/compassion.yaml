notes: >-
  White rare, turn order. The name is a placeholder. The original card with this role is Honor (a chosen player goes
  first each round regardless of who won the previous round). This one is a state-based selector, not a chosen player:
  whoever is behind on board goes first, which fits white's comeback role (Forgetfulness). The tie rule is written into
  the card as a parenthetical reminder. Honor's wording supplies the phrasing ("goes first each round regardless of who
  won the previous round"). impl_tier 2 is provisional: it replaces the first-player rule for as long as it is in play;
  Honor already overrides it, so the hook exists. The "moods are cards in play" reminder is left off because the card
  already has another parenthetical.
