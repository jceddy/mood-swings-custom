notes: >-
  Blue partner for the recycle axis (design/axes.md). The name is a placeholder. Recollection's cycle as a common one-shot.
  It bends the pool's rule that a draw is paid from your own hand or board (Hate, Zeal, Doubt, Paranoia) the same way
  Recollection does: the cost is a discard-pile card that belongs to no one, and the restriction is the depleting pile (it
  does nothing with an empty pile). Value 3 like Warmth, another unconditional-ish card gain. Open question for the group:
  keep the free draw, or make it a 1-for-1 swap with the pile. It sits next to Rapport (a hand loot), so the two blue card-
  flow commons do different things. impl_tier 1 is provisional.
