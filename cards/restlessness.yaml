rules_text: >-
  While in play — This mood's value is 6 if there are three or more different values among your moods that don't have
  this ability. (Moods are cards in play.)
rulings:
  - Moods with this ability, including this one, are not counted, so two copies of Restlessness never count each other. "Different values" means current values.
