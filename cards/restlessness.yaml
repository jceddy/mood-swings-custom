notes: >-
  Green uncommon, static conditional value (3 to 6). The name is a placeholder. The original green cards with this role
  key on parity or counts (Tranquility, Fondness, Euphoria). History: it first counted colors among your moods, which
  overlapped Celebration (original: more colors among your moods than each other player's), Emptiness (+1 per color
  among all moods), Determination and Kinship; the clone check moved it to values. It now rewards a board with varied
  values, which is checkable in paper by looking at your own moods ("value" means the current value). It has no color
  requirement, so it works in any deck, and it asks for the opposite of Solidarity and Familiarity (matching numbers) in
  the white numbers plan. Playtest worry: three different values is easy to reach on a board of five or more moods; four
  is the fallback. impl_tier 1 is provisional: a count of distinct values over your own moods. The reminder text about
  moods being cards in play was added, following the printed cards that count moods or put your own moods into the
  discard pile.
