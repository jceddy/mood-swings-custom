notes: >-
  Green uncommon, static conditional value (3 to 6). The name is a placeholder. The original green cards with this role
  key on parity or counts (Tranquility, Fondness, Euphoria). History: it first counted colors among your moods, which
  overlapped Celebration (original: more colors among your moods than each other player's), Emptiness (+1 per color
  among all moods), Determination and Kinship; the clone check moved it to values. It now rewards a board with varied
  values, which is checkable in paper by looking at your own moods ("value" means the current value). Loop fix: it first
  counted all your moods including itself, so with a 1 and a 6 on the board it counted itself as 3, became 6, dropped to two
  different values, became 3 again, and so on. It now ignores moods with this ability (the Competitiveness fix), which also
  stops two copies from counting each other. The price is that it needs three different values among your other moods, so a
  board of at least four; if it never turns on in playtests, the fallback is "two or more". It has no color
  requirement, so it works in any deck, and it asks for the opposite of Solidarity and Familiarity (matching numbers) in
  the white numbers plan. Playtest worry: it was thought too easy to reach on a board of five or more moods before the loop fix, which now
  makes it harder; check that it turns on often enough (fallback "two or more"). impl_tier 1 is provisional: a count of distinct values over your own moods. The reminder text about
  moods being cards in play was added, following the printed cards that count moods or put your own moods into the
  discard pile.
  The alternate value 6 is the lower-left die (value 3 printed, 6 when the condition holds), as on the other conditional
  cards; the card file used to have no alternate value, which left the lower-left die off in the MSE set.
