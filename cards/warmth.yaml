notes: >-
  Ally cycle (slot C01), green. The name is a placeholder. Replaces the original value-swapping Enjoyment. Green's allies are red
  and white; counting follows the original wheel (any player's moods, the two colors combined). Uses green's recursion verb:
  a free pickup from the discard pile, as in Nostalgia (green common: put a card from the discard pile into your hand, plus an extra
  play). Unlike black's Yearning (a 1-for-1 swap), green's pickup costs nothing, which is the pool's precedent for green. Nostalgia
  stays on the reprint list (Q3): it is a different role, a 0-value acceleration card with a pickup attached, while Warmth is a
  conditional pickup on a 3-value body. Wording follows Nostalgia and
  Cynicism ("put a card from the discard pile into ... hand"). Value 3, not 2 (a contributor's
  point, agreed): the pickup nets a card like Compulsion (3) and is conditional, so when it whiffs it should still be at least the
  modal common value; at 2 it was worse than Zeal, Compulsion and Suspicion (all 3). Other cycle cards stay at 2 for now (the
  enemy cards look weaker than their broad cousins at the same value) and are a playtest question. impl_tier 1 is provisional: a
  color count plus an existing pickup from the discard pile.
