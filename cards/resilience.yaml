notes: >-
  Green partner for the replay axis. The name is a placeholder. A rare engine in Grace's wording ("during each of your turns
  (including the turn you play this mood)"), restricted by printed number so it stays bounded: each round you can replay one
  cheap mood from the pile and re-trigger its after-playing text. Restraint shuts it off. Playtest question: with Thrift in
  the same deck it is a lot of cheap replays. impl_tier 1 is provisional: Grace's perpetual grant with a printed-number
  filter.
