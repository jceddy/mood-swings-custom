slot: B-C06
name: Schadenfreude
color: black
rarity: common
base_value: 3
alt_value: 6
to_play: false
while_in_play: true
after_playing: false
rules_text: >-
  While in play — This mood's value is 6 if an opponent discarded a card this round.
rulings:
  - Counts a card an opponent discarded from their hand, by any effect and at any point this round, including before this mood was played. Moods put into the discard pile from play do not count.
  - Does not count your own discards.
  - The condition is checked whenever values are counted, so this mood is worth 6 for the rest of the round once it is true, and 3 again at the start of the next round.
status: idea
reprint_of: null
impl_tier: 2
designer: jceddy
notes: >-
  Simplest of several older community versions of this idea. The others (a counter or value bonus whenever an
  opponent's mood leaves play, or drawing when an opponent loses a round) were set aside because the pool has no
  counters or accumulating values, "leaves play" is not pool vocabulary, and trigger wording appears only on mythics.
  History: it started as an after-playing 3->6 (like Condescension, Cynicism and Curiosity) checking this turn, was widened
  to count moods put into the discard pile too, and is now a while-in-play 3->6 that checks the whole round and counts
  only cards an opponent discarded from their hand (compare Suspicion); moods put into the discard pile no longer count.
  The pattern is now the "While in play — This mood's value is 6 if ..." common (Anticipation, Composure, Urgency), so the
  dice are black. Checking the round instead of the turn means an opponent's own discards on their turn count (FOMO,
  hand-size costs, Hellbent-style discards), not only a discard effect you play yourself, and it can turn on after you
  played it; values are counted at scoring, so what matters is whether anyone discarded by the end of the round. It is
  easier to turn on than the turn version (no combo needed, though you can only force it with a discard effect such as
  Suspicion or Nosiness), so check that a common 3 to 6 is fair. impl_tier 2 is provisional: it needs a round-scoped record of which
  players discarded a card from hand (Urgency already counts plays per round); if the simulator's round state
  already exposes that, it is tier 1. Verify before finalising. A stateless scaling rare in the same theme (value
  increases for each opponent with fewer moods than you) was floated as a separate card.
