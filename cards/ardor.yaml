notes: >-
  Red mythic, flexible slot, a mono-red payoff. The name is a placeholder. Each of your red moods gets +1 for every
  other red mood you have ("other" means other than Ardor), so with three red moods in play, counting Ardor, each is
  worth +2 and the bonus still grows roughly with the square of your red count. It builds on Dominance (R-M01, red
  plays), Adrenaline (R-R04) and Verve (R-R03, +2 to each red mood played this round); Kinship (G-R04, +1 for moods
  sharing a color) is a smaller cousin, and Vanity (original black mythic) is the same kind of scaler. The first
  version counted Ardor itself (+N for N red moods) and the first play tests found it too fast: 19 points with three
  red moods, 22 and 28 with four, 35 and 40 with five (the highest scores so far), and it decided most games it was
  in. Counting only the other red moods takes one point from each red mood (Q13, decided). It is static, so nothing
  prompts anyone in async play. Playtest worry: it may still snowball, and it makes Reassurance and the color sweepers
  matter; the next fallbacks are one for every two other red moods, or a cap such as "up to three". impl_tier 1: a
  count of your other red moods applied to each of them.
