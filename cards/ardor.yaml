notes: >-
  Red mythic, flexible slot, a mono-red payoff. The name is a placeholder. With three red moods in play each is worth
  +3, so the bonus grows with the square of your red count. It builds on Dominance (R-M01, red plays), Adrenaline
  (R-R04) and Verve (R-R03, +2 to each red mood played this round); Kinship (G-R04, +1 for moods sharing a color) is
  a smaller cousin, and Vanity (original black mythic) is the same kind of scaler. It counts itself, since it is a red
  mood. It is static, so nothing prompts anyone in async play. Playtest worry: a quadratic payoff may snowball, and it
  makes Reassurance and the color sweepers matter; the fallback is a cap, such as "up to three". impl_tier 1 is
  provisional: a count of your red moods applied to each of them.
