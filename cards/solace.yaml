notes: >-
  White common, re-roled from card-flow to short protection. The name is a placeholder. White has no card flow in the
  original pool and every version tried was a narrower Discernment or a loot that helps opponents, so the slot became a
  round-long shield. The original pool has no protection card; Reassurance (W-U08) is the permanent version for cheap
  moods. This one covers all your moods but only until the end of the round, so it is a defensive tempo play. It stops
  targeted effects (Shrewdness, Covetousness, Vengeance-style choices) and does not stop sweeps or effects where the owner
  chooses their own mood. Playtest worry: a common that can blank a round of targeted removal. impl_tier 2 is
  provisional: a round-long can't-be-chosen flag on a player's moods.
