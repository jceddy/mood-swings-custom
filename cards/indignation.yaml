notes: >-
  Enemy cycle (slot C02), red. The name is a placeholder. Replaces the original value-swapping Frustration. Red's enemies are
  white and blue; counting follows the original wheel (any player's moods, the two colors combined). Uses red's own pie verb:
  value-threshold removal to the discard pile, worded as in Shock ("put one of their moods with a value of 3 or less into the
  discard pile"). The threshold is 4 rather than Shock's 3 because the color limit narrows the targets. "May" because the chosen
  mood can be your own. Red would then have two removal commons next to R-C03 (Shock candidate); keep R-C03 the only broad one.
  Red removal is value-based while black's (Disdain) is color-based, which keeps the two enemy cards distinct. impl_tier 1 is
  provisional: a color count plus an existing value-limited removal.
