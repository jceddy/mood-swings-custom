notes: >-
  Ally cycle (slot C01), black. The name is a placeholder. Replaces the original value-swapping Pity. Black's allies are
  blue and red; counting follows the original wheel (any player's moods, the two colors combined). Uses black's
  discard-pile verb (Angst, Melancholy, Cynicism): a discard-pile loot, choosing a specific card from the pile. It stays 1 for 1 on
  purpose: the pool never lets you gain a card without paying one (a free "put a card from the discard pile into your hand"
  would be a net card), the same rule Rapport's loot follows. You can put back the card you just discarded, which does nothing.
  Wording follows Ambition ("discard a card from your hand. If you do, ...") and Cynicism ("put a card from the discard pile into
  ... hand"). It sits near the B-U05 graveyard role, so B-U05 should be bigger recursion rather than another small swap.
  Value 3, not 2 (cycle pass at one turn per round): the two-or-more-moods condition is met only about 0% in round 1, 16-35% in round 2 and 52-66% in round 3 (even colors, two players), so the card is often a vanilla early and should not whiff below the modal common value; its effect is a modest 1-for-1 swap. impl_tier 1 is provisional: a color count, a hand discard and a pick from the discard pile already exist as pieces.
