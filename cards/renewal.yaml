notes: >-
  Green partner for the replay axis (also useful in red). The name is a placeholder. Harmony with a price: the replayed mood
  is a one-round rental, then it cycles back into the deck (the "after scoring, ... if it's still in play" wording is
  Gluttony's and Insecurity's). The price is real because moods otherwise stay in play. Restraint shuts it off. impl_tier 1
  is provisional.
