notes: >-
  Black rare, graveyard engine. The name is a placeholder. The original cards with this role are Melancholy (play moods from
  the pile as though they were in hand) and Grief (play up to two additional moods from the pile). This one is a per-round
  rummage instead: take a specific card from the pile and discard one from hand, so it stays 1 for 1 (inside the draw rule).
  It feeds the pile it draws from, which makes it a partner for Reflection, Reverie and Reinvigoration. Start-of-turn
  wording follows Stubbornness; each player has one turn per round, so it triggers once per round. impl_tier 1 is
  provisional: a start-of-turn trigger, a pick from the pile and a hand discard all exist as pieces.
