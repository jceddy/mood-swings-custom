notes: >-
  White partner for the numbers axis. The name is a placeholder. A low-number extra play, worded like Dignity ("a 0, 1, 2, or
  3 in its top right corner"). Friendliness and Kindness already cover odd and even, so these grants use number ranges to
  avoid cloning them. Pairs with Confidence (the high-number grant) and with Humility's boost on small numbers. Restraint
  shuts it off. impl_tier 1 is provisional.
