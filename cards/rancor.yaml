notes: >-
  Red uncommon, re-roled from a steal-and-return loan to retaliation. The name is a placeholder. The original card with
  this role is Arrogance (an opponent chooses a white or blue mood and it becomes yours until this mood leaves); every
  variant was Arrogance with the color restriction removed or Recklessness. Covetousness (R-R01) already covers steals. This
  one answers removal: when an opponent's effect puts one or more of your other moods into the discard pile, a random
  one of that player's moods with a value of 3 or less is put into the discard pile. Sweeps count (Intuition, Reckoning,
  Belligerence) as well as targeted removal, but only once per effect, so a sweep that takes several of your moods taxes the
  attacker once. It does not trigger on your own effects. The threshold follows Shock. History: it first let the holder
  pick the target ("each time one of your other moods is put into the discard pile by an effect an opponent controls,
  you may put one of your opponents' moods with a value of 3 or less into the discard pile"). The group's async comment
  on Defensiveness showed that was an optional choice for the holder on an opponent's turn, once per mood removed; a
  second version made it mandatory and let the attacker choose; the final version is mandatory and random, which is red
  flavor, needs no choice from anyone, and keeps it a retaliation (the attacker cannot choose their cheapest mood). It
  never prompts anyone in digital asynchronous play. The random pick needs a method in paper, as Cruelty and
  Indecisiveness already do. Playtest worry: a random pick can still hit a rare engine that prints at 0 or 1; if it hits
  too hard, 1 or less is the fallback threshold. impl_tier 2 is provisional: the simulator needs to know which player
  controls the effect that moved a mood, and a random pick among that player's moods with a value of 3 or less. The
  inline "(moods are cards in play)" reminder was added in the clone check, because your own moods go into the discard
  pile, as on Bravado and Vindictiveness.
