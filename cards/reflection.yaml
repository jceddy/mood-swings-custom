notes: >-
  Blue partner for the recycle axis. The name is a placeholder. A hand engine: a loot on every play, so it pays off with
  extra plays. It stays 1 for 1 (the pool's draw rule), which makes it the milder cousin of Reverie. Trigger wording
  follows Scorn, Validation and Duplicity ("each time you play another mood"). With one turn per round it loots about once
  per round without extra plays. impl_tier 1 is provisional: the reaction timing and the loot both exist.
  Changed from "put a card from your hand on the bottom of the deck" to "discard a card from your hand": the first version was a
  weaker Reverie (it did the same thing, but a loot where Reverie gains a card, and only on later plays). Discarding feeds
  the discard pile, the resource that Reverie, Reminiscence, Warmth and Reinvigoration spend, so Reflection now creates fuel for
  the axis. It is still 1 for 1, so it stays inside the draw rule. Wording is Ambition's and Yearning's ("discard a card from your
  hand. If you do, ..."). Discarding your own cards does not count as an opponent discarding, so Schadenfreude does not turn on.
