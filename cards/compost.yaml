notes: >-
  Green common, re-roled from utility-small to a small pile-fuel effect. The name is a placeholder. The old role kept
  producing copies of Reminiscence (blue) or Suspicion (black). Mulch (G-R03) is the rare, optional engine that puts the
  top card of the deck into the discard pile each round; nothing at common fills the pile from the deck. This is a one-
  shot, mandatory version: two cards, face up, so no hidden information leaks. It feeds Accumulation, Remorse, Mimicry,
  Haunting and the pile plays (Resilience, Thrift), and it changes what the next round loser draws. It is mandatory and
  public, so it never prompts anyone in digital asynchronous play. Playtest worry: low impact on its own for a common,
  and it removes two random cards that could be good; the fallback is one card, or a choice of putting the top card into
  the discard pile. impl_tier 1 is provisional: a move of the top two cards of the deck to the discard pile.
