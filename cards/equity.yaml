notes: >-
  Blue rare, flex (hand equalizer). The name is a placeholder. There is no original card with this role. Hand sizes are
  public, so it works in paper, and the opponent chooses which cards go back, so no hidden information leaks. It uses blue's
  bottom-of-deck language (Recollection, Foresight), not discards, so it does not feed the pile. Cards in hand are a scarce
  resource (hands refill only through round losses and card effects), so making hoarders put cards back is a real cost to
  them and a one-sided effect for the player with the smallest hand. It is a hoarding check, not a comeback card: it does
  nothing if you have the most cards. Playtest worry: it conflicts with black's hand-pressure plan, because Neglect-style
  decks already shrink hands; check that the two do not double up. impl_tier 1 is provisional: a hand-size comparison and a
  hand-to-bottom-of-deck move both exist as pieces.
