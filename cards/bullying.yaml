notes: >-
  Red partner for the white numbers axis (design/axes.md). The name is a placeholder. The skeleton role (small sweeper)
  matches Rage (red uncommon 2: put all other moods with a value of 3 or less into the discard pile). This version is one-
  sided where Rage hits everyone, with a lower threshold (2 instead of 3), so it is stronger than Rage and prints 3 instead
  of 2. Persistence makes it hit harder: opponents' cheap moods stack up over the rounds. Worded with Guile's "your
  opponents' moods" and Rage's "you may put all". Playtest worry: together with Intuition, two one-sided sweeps in one color.
  impl_tier 1 is provisional: Rage's sweep with an opponents-only filter.
