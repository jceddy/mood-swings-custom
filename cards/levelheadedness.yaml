notes: >-
  White rare, re-roled from an unnamed reset effect. The name is a placeholder. The original pool has no card that
  rewrites scoring for a round: Awe (green) skips scoring, Meekness (white) suppresses moods of value 5 or more, and
  Pride (white) adds plays. For one round every mood scores 2, so the round goes to the player with the most moods and
  printed values stop mattering for that round (the check is only on scoring: targeting by value, Hellbent and similar
  conditions still use real values). It rewards wide boards and punishes decks of a few big moods, and it is a one-shot,
  so it never prompts anyone in digital asynchronous play. Playtest worry: a round decided by mood count is a big swing,
  and it may need to be limited to rounds that a player is behind in; the fallback is a cap, not a flat 2 (each mood
  scores at most 3). impl_tier 2 is provisional: a one-round scoring override applied while scoring.
