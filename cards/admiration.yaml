designer: ""
notes: >-
  Blue rare, copy effect. The name is a placeholder. The original card with this role is Creativity (becomes a copy of any
  mood in play). Green's Optimism re-triggers the after-playing effect of one of your own moods in play. This one reads the
  discard pile instead, so it uses pile fuel without draining it; it is a blue and green crossover, and Reinvigoration-style
  decks and sweepers fill the pile it needs. Duplicity's wording supplies "that mood's after-playing effect happens". Open
  ruling (add to the playtest list): what "this mood" means on a pile card that refers to itself, for example Infatuation.
  The proposed ruling is that it refers to the mood you just played. Choices on the copied effect are made fresh. A mood with
  no after-playing effect gives nothing. impl_tier 3 is provisional and the hardest of the five: the simulator would run
  another card's after-playing effect with a different source mood.
