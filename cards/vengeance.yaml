notes: >-
  Black uncommon, targeted removal. The name is a placeholder. The original black cards with this role include Fury ("one of
  their highest value moods") and Cruelty; this uses Fury's wording for the target restriction, so the opponent chooses among
  ties and there is no free pick of the best answer for you. It is the clean, no-condition removal at uncommon, with a
  printed value of 3 as its price. impl_tier 1 is provisional: a choose-an-opponent effect with a highest-value filter
  exists.
