rules_text: >-
  While in play — This mood's value is 6 if there are four or more moods with even numbers in their top right corners.
  (Moods are cards in play.) (0 is even.)
status: idea
reprint_of: null
impl_tier: 1
designer: ""
notes: >-
  White partner for the numbers axis. The name is a placeholder. A Determination-style conditional ("three or more moods
  that share a color") keyed to even numbers; counts any player's moods. Its printed 3 is odd, so it doesn't count
  itself. The threshold of four is a guess: evens are about half the pool, so it is usually met by round three or four.
  impl_tier 1 is provisional. The reminder text about moods being cards in play was added, following the printed cards
  that count moods or put your own moods into the discard pile.
