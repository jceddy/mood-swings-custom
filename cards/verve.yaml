notes: >-
  Red partner for the playing-red-moods axis. The name is a placeholder. A scoring engine for playing red moods: each red
  mood you played this round is worth 2 more, so extra plays pay off. "Played this round" has precedent in Glee ("if you
  played it this round") and Patience. With one play per turn and one turn per round it is usually +2 per round; it is better
  with extra plays. impl_tier 1 is provisional: a per-round record of which moods you played already exists for Glee and
  Patience.
