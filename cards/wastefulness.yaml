notes: >-
  Green rare, re-roled from a discard-pile play engine to pile fuel, since the pile engines (Resilience, Thrift,
  Wistfulness, Reinvigoration) already exist and nothing in the set fills the pile from the deck. The name is a placeholder.
  It feeds Possessiveness, Remorse, Admiration, Haunting and every pile play, and with Resilience or Thrift it plays the top
  card of the deck. The optional choice is on your own turn. The top card becomes face up in the pile, so no hidden
  information leaks and the next draw is changed for everyone. Playtest worry: with Resilience or Thrift it is free
  plays from the top of the deck, which is card advantage; the fallback is to put the card into the pile only on turns
  when you cannot play from it. impl_tier 1 is provisional: a start-of-turn trigger that moves the top card of the deck
  to the discard pile.
