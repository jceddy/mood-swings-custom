notes: >-
  Green mythic, flexible slot, and a build-around for the 3 to 6 conditional cycle, outside the pile axis. The name is a
  placeholder. Green's commons and uncommons that jump from 3 to 6 (Determination, Resolve, Restlessness, Urgency, Possessiveness,
  Honesty) get a payoff here, so green has a second axis beside the discard pile (axis: moods worth 6 or more). It is the
  high-end bookend of Gratitude (G-U06, moods worth 2 or less score an extra time); the two do not overlap, since a mood is
  worth either 2 or less or 6 or more. Not a clone of an original card: Exhilaration (red mythic) scores all your moods an
  extra time and costs a mood to play, Enthusiasm scores one mood an extra time, and Bliss scores moods that share a color
  with a discarded card two extra times. Chosen over a copy of your best printed value (Reverberation), a color-sharing extra-play
  engine (Fellowship) and bounded growth for low moods (Rising Tide, which works against Gratitude). Wording follows Gratitude
  ("score each of your moods ... an extra time"). It uses the current value, so conditional moods count when they are showing 6.
  The body is 1 and does not count itself. Mandatory static effect with no choice, so no prompts in the digital clients.
  Power watch: three moods at 6 each score twice, which can run away; the fallbacks are a threshold of 7 or scoring only one
  such mood an extra time (Enthusiasm style). impl_tier 1: the simulator already has Gratitude and Enthusiasm style
  while-scoring effects.
