notes: >-
  Blue partner for the recycle axis. The name is a placeholder. A free recycle each round: it turns a mood on the board into
  a card in hand (hands are scarce), lets you replay it to re-trigger its after-playing text, and refills the hand against
  hand pressure (Neglect). Replaying costs a play, so it is slow without extra plays. It can bounce itself. Start-of-turn
  wording follows Stubbornness. impl_tier 1 is provisional.
