notes: >-
  Green uncommon, second static conditional value (3 to 6). The name is a placeholder. It rewards extra plays: with only one
  play per turn it stays at 3, and it needs an extra-play card (Harmony, Grace, Wistfulness, Duplicity) to turn on. The play
  counts as part of this round, so it can switch on during your own turn and stays on at scoring. It does not count plays
  before it enters. Playtest question: is the condition too easy in decks with many extra plays? impl_tier 1 is provisional:
  the simulator tracks plays per turn.
  The alternate value 6 is the lower-left die (value 3 printed, 6 when the condition holds), as on the other conditional
  cards; the card file used to have no alternate value, which left the lower-left die off in the MSE set.
