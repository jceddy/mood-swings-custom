notes: >-
  Blue uncommon, re-roled from an open flex slot to a hand-gated play grant. The name is a placeholder. The original
  cards with this role are Benevolence, Friendliness and Kindness (extra plays gated by color or number). This one gates
  the extra play by hand size, which is public in paper. Because cards in hand are scarce, it is a comeback play grant:
  it turns on when you have run your hand down. The hand is counted after this mood leaves it. Ties do not count.
  Playtest worry: it can be very good in a deck that runs its hand dry, and dead in a deck that hoards. impl_tier 1 is
  provisional: a hand-size comparison on an extra-play grant.
