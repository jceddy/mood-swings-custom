impl_tier: 2
designer: Dr Potato
notes: >-
  Black mythic, flexible slot, submitted by Dr Potato. It was first submitted as a green mythic, then moved to black
  because green already has a powerful recursion mythic (Reinvigoration). The name is a placeholder. The wording was cleaned
  up: "any number of cards from your hand" is the pool's phrasing (Doubt, Discernment), and "If you do" ties the extra
  plays to the discard; "on your next turn" matches Joy. It turns hand cards into extra plays next turn, picked from the
  whole discard pile, including moods other players discarded or sacrificed. It is not card advantage, because the
  discarded cards stay in the pile; the price is a delay of one round, and in exchange the plays are free and you choose
  the best moods in the pile (discarding four cards gives a five-play turn). Black already has pile plays in the
  original pool (Angst, Melancholy, Grief); this one is delayed and scales with your hand, where Grief gives a flat two,
  and Reinvigoration (green) scales with your board and happens this turn. It pairs with Longing, Brooding, Dejection, Martyrdom
  and Sentimentality, which fill or use the pile. The delay gives opponents a full round to answer: Rudeness (W-R06) blanks
  next turn's extra plays exactly, and Restraint, Defensiveness and Pettiness also work. Emptying your hand exposes you to
  Neglect (B-M01) if an opponent has one in play. Everything happens on its owner's turns, so nothing prompts another
  player in async play. Paper needs a marker for the number of banked plays. Playtest worry, first version: it was too strong (a 2 that banked a free burst of plays, with nothing the opponent could do
  except block extra plays). Now it prints 0 and the plays are kept only if you still have Haunting at the start of your next
  turn, so the opponent has a full round to remove it: Rashness (value 1 or less), Belligerence (2 or less), Shock (3 or less)
  and any bounce or removal all answer it, while Reassurance (opponents can't choose your moods with a value of 2 or less)
  protects it. Printing 0 also means the turn you play it scores nothing. The burst size with a big pile and a big hand is
  still the worry, since each play triggers "each time you play another mood" engines; a cap such as "up to three" is the
  fallback. Check that it is still playable, now that it can simply be removed. impl_tier 2 is provisional: a banked count of
  extra plays from the pile for the next turn (the same shape as Joy), checked against Haunting still being in play at the
  start of that turn.
  The word next is bold in the MSE set, as in the printed Joy (on your next turn).
