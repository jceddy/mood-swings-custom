rules_text: >-
  After playing this mood — You may discard any number of cards from your hand. If you do, on your next turn you may play
  that many additional moods from the discard pile if you still have this mood at the start of that turn.
emphasis: [next]
rulings:
  - You keep the plays only if this mood is still in play under your control at the start of your next turn. If it was put into the discard pile or into a hand, or another player took it, the plays are lost; the cards you discarded stay discarded.
  - A suppressed Haunting is still in play, so you keep the plays.
status: idea
