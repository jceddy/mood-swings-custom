notes: >-
  Blue uncommon, re-roled from steal-swap to a play cap on opponents. The name is a placeholder. Barter (U-R01) and
  Plunder (R-R01) already cover swaps and steals. The original pool has no card that caps another player's plays;
  Restraint (W-M02) forbids extra plays for everyone and Obstinacy (G-C08) limits only you. This one lets each opponent
  play one additional mood a turn at most, so a combo turn is capped at two plays (the base play and one more), while
  decks that use one or two extra plays barely notice it. It does not affect Hurt Feelings' second base play. It is a
  static rule, so it never asks anything of its holder. History: it first read "each time an opponent plays an
  additional mood, after its after-playing effect, you may put that mood into its player's hand". The group pointed out
  two problems: in digital asynchronous play that asks the holder to answer every extra play (impossible with 20 or more
  plays in a turn), and a bounce after the effect is a gift to a combo deck, since the mood returns to hand to be
  replayed. Printed at 3 because the effect only matters against extra-play decks. Playtest worry: it may be dead
  against decks without extra plays. impl_tier 2 is provisional: a per-opponent cap on extra plays while this mood is in
  play, the same hook Restraint needs.
