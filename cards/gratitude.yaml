notes: >-
  Green uncommon, re-roled from a scoring modifier to a cheap-mood scoring modifier. The name is a placeholder. The
  original cards with this role are Enthusiasm (score one of your moods an extra time, 0 points) and Exhilaration (red
  mythic: score all your moods an extra time, with a sacrifice to play). This one scores every mood of yours with a
  value of 2 or less an extra time, so it rewards wide boards of small moods (Volatility and Humility pull the same way)
  and does nothing for a 0 or a big mood. It reads the current value, so a mood that has grown or been boosted past 2
  stops getting the extra scoring, and a suppressed mood (value 0) scores nothing anyway. It is static, so nothing
  prompts anyone in async play. History: it first looked at the current value; the group asked for the printed number in
  the top right corner ("with a 0, 1, or 2 in its top right corner"), then asked whether moods with a value above 2 from
  the dice in the lower left corner could be left out (a wording using "moods that are using the dice in their lower
  left corner" was proposed), and after discussion decided to keep the first version, so the current value is what
  counts. Dr Potato's Cooperation (green uncommon, 0 points: score your two lowest value moods, other than this one, an
  extra time) was considered for the slot and nearly duplicated this card, so this card was kept and the submission was
  not written. It is the closest card to an original (Exhilaration at lower rarity). Playtest worry: it needs 1s and 2s
  on the board (values, not printed numbers); the fallback is a value of 3 or less. impl_tier 1 is provisional: the
  scoring hooks Enthusiasm and Exhilaration already use, with a filter on the current value.
