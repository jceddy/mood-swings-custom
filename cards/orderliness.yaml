slot: W-M01
name: Orderliness
color: white
rarity: mythic
base_value: 2
alt_value: null
to_play: false
while_in_play: true
after_playing: true
rules_text: >-
  After playing this mood — Choose odd numbers or even numbers. While in play — Each of your other moods with a number
  of the chosen type in its top right corner has its value increased by 1. (0 is even.)
status: idea
reprint_of: null
impl_tier: 1
designer: ""
notes: >-
  The name is a placeholder. White's build-around mythic for the numbers axis (Q5, design/axes.md): a deck stacked toward odd or
  even printed values gets a boost on every mood. Decided: boost +1 (not Wonder's +2, because moods stay in play and the boost
  accumulates with the board), value 2 like Scorn, and "other moods" so the card does not boost itself. The choice is made on
  entry, so there is no deck-building tension in committing early; the deck still needs to be concentrated to benefit. Wording
  follows Wonder ("choose a color ... of the chosen color", here "a number of the chosen type"; an earlier draft said "one of the chosen numbers", which could read as choosing a set of specific numbers instead of a class of number), Friendliness and Kindness ("in its top
  right corner" means the printed value, so the boost cannot change a mood's own parity), Spite ("0 is even") and Idealism (white
  already modifies the values of your own moods from a printed feature). "Parity" is avoided in the text on purpose: the pool says
  odd and even. Compatible with Restraint (W-M02, no extra plays involved); boosting your moods' values also raises Dominance's
  reach. Considered and not chosen: number control (suppress and lock out a chosen number, which reads as a hate card and could
  fit W-M03) and a Wonder-style self-scaling body (too close to Wonder). impl_tier 1 is provisional: a chosen value on entry
  (Wonder, Imagination) and a value modifier on your own moods (Idealism) already exist as pieces.
