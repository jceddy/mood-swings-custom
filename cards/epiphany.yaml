rules_text: >-
  After playing this mood — Reveal cards from the top of the deck until you reveal a card with a 0, 1, 2, or 3 in its
  top right corner. You may play that card as an additional mood this turn. Put the other revealed cards, and that card
  if you don't play it, on the bottom of the deck in any order.
