notes: >-
  Blue mythic, flexible slot, a free play from the deck. The name is a placeholder. The original pool has no card that
  plays from the deck: Serendipity (this set's red uncommon) plays a random card from your hand, and Foresight (U-M02)
  draws cards and puts cards back, so it nets zero cards. This one nets you a mood: it reveals cards until it finds one
  that is a 0, 1, 2 or 3, which is most moods, and lets you play it as an additional mood, with its after-playing
  effect. The cards it passes over go to the bottom of the deck, so it also reshuffles what the next round loser draws.
  Everything happens on the owner's turn and the revealed cards are public, so no hidden information leaks and nothing
  prompts anyone in async play. Playtest worry: cards are scarce, so a free mood may be a lot for one card; the fallback
  is to reveal only the top three cards and play one of them, without the 0-to-3 filter. It pairs with the free-play
  cycle. impl_tier 2 is provisional: a reveal-until loop on the deck, then a play from the revealed cards.
