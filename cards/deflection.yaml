notes: >-
  Blue uncommon, targeted bounce. The name is a placeholder. The original blue cards with this role bounce a mood to its
  owner's hand with no follow-up; this one adds a tempo lock: the bounced mood (and any duplicate of it) can't be replayed
  right away. The lock is by card name, not by individual copy, because a player can hold duplicates and paper has no way to
  track one copy without revealing hidden information. "Their next turn" is exactly one turn (each player gets one turn per
  round), so it costs the bounced player one round of replaying that card, not the card itself. Bounce still costs the
  opponent a play, since a hand card needs a turn to come back. Hand sizes are public, so the opponent's hand growth is
  visible. Playtest worry: a repeated name lock against a deck with many duplicates. impl_tier 2 is provisional: a per-player
  name restriction on plays that expires after that player's next turn.
