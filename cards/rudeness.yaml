notes: >-
  White rare, flex slot. The name is a placeholder. It started as a white common in W-C07 (Choose a player. That player
  can't play additional moods during their next turn, 2 points). A group comment suggested a rare version that hits all
  other players; because that is the same card in a 2-player game, the effect was widened with Defensiveness's strip of
  after-playing effects. Each other player's next turn becomes at most one vanilla body: no additional moods and no
  after-playing effects. At 3 or 4 players it hits every opponent. The original pool has no card that restricts another
  player's plays; Restraint (W-M02, static, every player including you) and Defensiveness (U-U05, static, opponents'
  additional moods lose their effects) are the static relatives, and Pettiness (B-U08) skips a whole turn for a card. It
  is a one-shot on one turn, so it overlaps with none of them. Hurt Feelings' second base play is a round attribute, not
  an additional mood, so the parenthetical copies Restraint's. It is a one-shot with nothing optional and nothing chosen
  on the target's turn, so it never prompts anyone in digital asynchronous play. Printed at 1. Playtest worry: blanking
  one full turn for every opponent may be strong for a rare, especially against a player who set up a combo turn; the
  fallback is to hit only the chosen player. impl_tier 2 is provisional: a one-turn flag on each other player that
  blocks extra-play grants and skips after-playing effects.
