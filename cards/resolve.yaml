notes: >-
  Green common, re-roled from a small interaction to an underdog value. The name is a placeholder. Green has no removal
  in the original pool, so every interaction idea was a gift or a clone of Generosity or Joy. The original cards with
  this role are Chivalry and Triumph (tempo conditions: went first or not). This one keys on round wins, which are
  public (first to 3 wins the game): it is on while you are behind in round wins. Vindication (G-R02) is the opposite, a
  snowball scaling card. With equal wins the condition is false (ties do not count). Playtest worry: it is only on when
  behind, and it turns off as soon as you catch up. impl_tier 1 is provisional: a comparison of round-win counts, which
  the simulator already holds.
