slot: B-M01
name: Neglect
color: black
rarity: mythic
base_value: 2
alt_value: null
to_play: false
while_in_play: true
after_playing: false
rules_text: >-
  While in play — Before scoring, each opponent with no cards in their hand puts one of their highest value moods
  into the discard pile.
rulings:
  - Triggers once each round, after every player has taken their turn and before the round is scored, so it can trigger in the round you play it. The check is made before the round loser draws.
  - If there is no scoring this round (Awe), it does not trigger.
  - The opponent chooses among their highest value moods only when there is a tie.
status: idea
reprint_of: null
impl_tier: 2
designer: ""
notes: >-
  The name is a placeholder. Black's build-around mythic for the hand-pressure axis (Q5, design/axes.md): every card that empties
  or drains hands (Suspicion, Entitlement, Compulsion, Paranoia, Nosiness, FOMO's costs) becomes a threat, because an empty hand
  now costs the opponent their best mood and lowers their score that same round. It keys off "no cards in their hand" because an
  empty hand is visible to everyone (hand sizes are public). It works as a deterrent as well as a payoff: opponents have to keep
  a card in hand, a tempo cost even when it never triggers.
  History (first playtests): it was a 0 with "At the start of each of your turns, each opponent with no cards in their hand puts
  one of their moods into the discard pile". Three problems: (1) a 0 that could not trigger on the turn you played it, so it cost
  you the round; (2) the round loser draws and the winner goes first, so at the start of your turn the only empty-handed
  opponent was one who had won last round or had gone before you, and as the winner you could never trigger it in a two-player
  game; (3) the opponent chose which mood to lose, and a player who emptied their hand did it with cheap accelerators, so they
  gave up the cheapest one. Now: value 2, "Before scoring" (after the last player's turn, before the loser's draw, which is the
  lowest point for hands in a round, so an empty hand is as likely as it gets and turn order no longer matters; it also lowers this
  round's score and can trigger the round you play it), and "one of their highest value moods" (Fury's wording) so the best mood
  goes. Open worry from the group: an empty hand is still hard to get without hand disruption; a version that discards a card
  first ("Before scoring, each opponent discards a card from their hand. If they can't, they put one of their highest value moods
  into the discard pile.") was proposed as the fix and is the next thing to try, and "two or fewer cards" is another.
  Other levers if it is too strong: only the first empty-handed opponent each round, only moods with a value of 3 or less. Black
  mythics were printed 0 (Vanity, Malice, Sadness), but those scale, and Neglect needs a body that is worth a play. Considered and
  not chosen: an empty-hand scaling body (3 per empty-handed opponent; too close to Vanity) and a discard-payoff loot (needs a
  new discard trigger in the simulator). impl_tier 2: "Before scoring" is a new trigger point (the original pool and the simulator
  have "after scoring" and "while scoring"); the highest-value choice, the empty-hand check and the discard exist already.
