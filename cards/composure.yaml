notes: >-
  Black partner for the hand-pressure axis. The name is a placeholder. Hand sizes are public, so the comparison is easy to
  check in paper. It rewards disruption plus keeping your own hand: discard and steal effects shrink the others' hands while
  FOMO-style costs shrink yours, which is a deliberate tension. Worded like Superiority ("more moods than each other
  player"). Ties do not count (more than each other player). impl_tier 1 is provisional: Superiority's comparison keyed to
  hand sizes.
