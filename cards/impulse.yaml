notes: >-
  Blue partner for the recycle axis. The name is a placeholder. A risky extra play that is not Insecurity (which puts the
  extra mood back in your hand): here the risk is losing this mood's board presence, in exchange for getting the card back to
  replay and re-trigger its after-playing text. Wording follows Insecurity ("after scoring, put that mood into your hand if
  it's still in play"). Persistence makes the cost real: a mood that would have stayed in play every round leaves after
  scoring. Restraint shuts it off. impl_tier 1 is provisional.
