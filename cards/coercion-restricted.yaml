rules_text: >-
  After playing this mood, choose an opponent who has one or more cards in their hand and one or more moods.
  That player may reveal their hand. If they do, choose a card from it and put it into your hand, and you may
  play it as an additional mood this turn. If they don't, that player chooses one of their highest value moods
  and puts it into the discard pile.
