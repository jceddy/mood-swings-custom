notes: >-
  Red partner for the playing-red-moods axis. The name is a placeholder. A tempo engine bounded to one extra play per turn:
  if your play is a red mood you get another play. It is weaker than Hope (a green rare that grants an unconditional extra
  play each turn) because it needs a red play first, but it compounds on a growing board. Restraint shuts it off. Trigger
  wording follows Scorn, Validation and Duplicity ("each time you play another mood"), narrowed to red and to the first time
  each turn. Main playtest question: is a repeatable extra play every round too strong at rare? impl_tier 1 is provisional:
  the reaction timing and an extra-play grant both exist.
