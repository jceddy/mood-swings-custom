notes: >-
  Green rare, re-roled from a pile-related flex to time scaling. The name is a placeholder. The original scaling cards
  count something on the board or in a hand (Euphoria counts moods, Sloth counts cards in hand) and Vindication counts
  round wins; this one counts time. "Permanently" is in the original pool (cards that permanently change a mood's
  value), so the simulator has a precedent, and on paper it needs a counter such as a die. It gains 1 each round, so a
  mood that stays in play for five rounds is worth five. It is bounced or removed like any other mood, and a replayed
  copy starts again at 0. It is mandatory and automatic, so it never prompts anyone. Playtest worry: the counters on
  paper; a slow card that opponents can simply remove. impl_tier 2 is provisional: a per-mood value counter that the
  simulator already needs for permanent changes.
