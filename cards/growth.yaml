notes: >-
  Green rare, re-roled from a pile-related flex to time scaling. The name is a placeholder. The original scaling cards
  count something on the board or in a hand (Euphoria counts moods, Sloth counts cards in hand) and Vindication counts
  round wins; this one counts time. "Permanently" is in the original pool (cards that permanently change a mood's
  value), so the simulator has a precedent, and on paper it needs a counter such as a die. It prints 2 and gains 2 each
  round, so a mood that stays in play for five rounds is worth 12. History: it first printed 0 and gained 1 each round;
  the group asked for it to start at 2 and grow by 2. Abundance (G-U06) scores moods with a value of 2 or less an extra
  time, so Growth gets that bonus only in the round it is played (value 2) and not after it has grown. It is bounced or
  removed like any other mood, and a replayed copy starts again at 2. It is mandatory and automatic, so it never prompts
  anyone. Playtest worry: it is now a fast clock (the value is 2, 4, 6, 8 in consecutive rounds), so check it is not too
  strong when left alone, and that opponents have time to remove it; the fallback is to grow by 1 or to start at 1.
  Counters on paper are the other worry. impl_tier 2 is provisional: a per-mood value counter that the simulator already
  needs for permanent changes.
