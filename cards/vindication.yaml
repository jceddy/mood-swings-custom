notes: >-
  Green rare, scaling value. The name is a placeholder. The original cards with this role are Sloth (+1 per card in your
  hand) and Euphoria (+1 per mood in play). This one scales with round wins instead, which is a new axis: the game is first
  to 3 round wins, so it is worth up to +4 before the last round. It is a snowball card (it rewards leading), capped by the
  game length; Forgetfulness, which removes a round win, pushes it back. Wording echoes Bashfulness ("if you won the round").
  It no longer fits the black hand-pressure plan for G-R02 (a per-card-in-hand scaler in Sloth's style), so that partner slot
  is dropped from design/axes.md. impl_tier 2 is provisional: round wins are derived from scored rounds, and the simulator
  would read that count for a value.
  Value raised from 0 to 2 (group review): the game is first to 3 round wins, so at most 2 wins count when a round scores,
  and +2 per win topped out at +4 on a 0-value body, which is weak for a rare. At value 2 it runs 2, 4, 6 for 0, 1 and 2
  round wins. That is strictly stronger than the alternative of +3 per win on a 0 body (0, 3, 6): the same ceiling, with a
  better floor, and no dead 0 in the early rounds when the card is most likely to be played. The total now peaks at 6, in
  line with Euphoria (about 6 by round three).
