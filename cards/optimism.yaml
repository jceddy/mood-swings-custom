notes: >-
  Green partner for the replay axis (re-triggering after-playing effects). The name is a placeholder. It replaces an earlier
  draft (Harmony plus a one-round-rental price, which was strictly worse than Harmony). It re-triggers an effect without a
  play or a hand card, a one-shot cousin of Duplicity (mythic: each time you play another mood, its after-playing effect may
  happen an additional time). Wording: Thrill's and Bravado's "one of your other moods", the pool's "you may ... If you do",
  and Duplicity's "that mood's after-playing effect happen an additional time". The repeated effect gets fresh choices, as
  with Duplicity. It can target a mood from an earlier round, since moods stay in play, so its power grows with the board;
  the main playtest worry is repeating a removal or sweeper effect (Disdain, Indignation) or an extra-play grant
  (Camaraderie, Fervor), where it effectively pays for itself. Restraint blunts the extra-play cases. Value 3 for an uncommon
  engine-like effect. impl_tier 2 is provisional: Duplicity repeats effects when a mood is played; repeating the effect of a
  mood already in play on demand is new.
