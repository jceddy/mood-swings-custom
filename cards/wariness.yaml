notes: >-
  Enemy cycle (slot C02), green. The name is a placeholder. Replaces the original value-swapping Disregard. Green's enemies are blue
  and black; counting follows the original wheel (any player's moods, the two colors combined). Green has no removal in the
  original pool, so the enemy card is a gift and tempo effect (the skeleton's suggestion): giving a card away (Condescension,
  Fascination) in exchange for an extra play (Ambition's "If you do, you may play an additional mood this turn"). Giving the card to
  another player is worse for you than Ambition's discard, and the 2+ gate adds a condition, so it was first worth 3 instead of Ambition's 2 (see the end of these notes for the value history).
  The cycle now has three extra-play commons (white's Camaraderie, red's Fervor, this one), each with a different price (none, the
  mood is discarded after scoring, a card given away). If that feels repetitive, this is the one to change. impl_tier 1 is
  provisional: a color count, a gift of a card from hand and an extra play all exist as pieces.
  Value 3. History: it was first 3, then raised to 4 in the cycle pass (the two-or-more-moods condition is met only about 0% in
  round 1, 16-35% in round 2 and 52-66% in round 3 with even colors and two players, so it is often a vanilla early). The group
  pointed out that at 4 it was just a better Laziness (the original green vanilla 4): the extra play sits behind a "may", so the
  card could never be worse than a flat 4 and the gift was free to try. It was the only colored common worth 4. Back at 3 it
  matches the modal common and the rest of the cycle (Camaraderie is 2, the others 3), and it is a real choice against a vanilla
  4: a flat 4, or a 3 that can turn into an extra play for a card. A whiff on the condition is then an ordinary 3.
