notes: >-
  Blue common, conditional (3 to 6). The name is a placeholder. The original card with this role is Superiority (black: 7 if
  you have more moods than each other player). This one keys on cards in hand, which blue draws and hoards; hand sizes are
  public, so it is checkable in paper. It is the mirror of Austerity (white), and it sits against Equity (blue rare), which
  makes hoarders put cards back. Ties do not count. Playtest worry: it asks you to keep cards in hand while the set wants you
  to spend them, so check whether it is ever true on the turn it matters. impl_tier 1 is provisional.
