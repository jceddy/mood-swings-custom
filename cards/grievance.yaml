notes: >-
  Blue rare, flex (hand equalizer). The name is a placeholder. There is no original card with this role. Hand sizes are
  public, so it works in paper, and the opponent chooses which card goes back, so no hidden information leaks. It uses blue's
  bottom-of-deck language (Reverie, Premonition), not discards, so it does not feed the pile. Cards in hand are a scarce
  resource (hands refill only through round losses and card effects), so making a hoarder put a card back is a real cost to
  them. It is a hoarding check, not a comeback card: it does nothing if you have the most cards. History: it first made each
  opponent put cards back until their hand matched yours, which the group judged too oppressive (Rationalization has the same
  issue). It now takes a single card from each opponent with a larger hand, and the printed value went from 1 to 3 to reflect
  the weaker effect. Suspicion (black common, value 3) makes any number of players discard a card with no condition, so 3
  keeps Grievance's body level with that while its effect is conditional and does not feed the pile. Playtest worry: a single
  card per use may now be too weak; 2 is the fallback value. It conflicts mildly with black's hand-pressure plan, because
  Neglect-style decks already shrink hands. impl_tier 1 is provisional: a hand-size comparison and a hand-to-bottom-of-deck
  move both exist as pieces.
