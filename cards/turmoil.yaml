rules_text: >-
  After playing this mood, choose odd or even and choose a player. That player puts each card from their hand with a
  number of the chosen type in its top right corner on the bottom of the deck, then draws that many cards. (0 is even.)
status: idea
reprint_of: null
impl_tier: 1
designer: ""
notes: >-
  Blue partner for the white numbers axis. The name is a placeholder. A forced cycle of one type, 1 for 1: you can target an
  opponent (it strips their best cards of that type for random replacements, which is variance) or yourself (shed off-type
  cards). Worded like Doubt ("put them on the bottom of the deck, then draw that many cards") and Routine ("a number of the
  chosen type"). Hand sizes are public but contents are not, so the target shows the cards they put back. Overlaps
  Discernment (W-U05) when you target yourself; Discernment is optional and self-only, this is mandatory and can hit anyone.
  impl_tier 1 is provisional: Doubt's cycle forced on another player with a printed-number filter.
