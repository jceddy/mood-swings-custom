slot: U-M01
name: Recollection
color: blue
rarity: mythic
base_value: 2
alt_value: null
to_play: false
while_in_play: true
after_playing: false
rules_text: >-
  While in play, each time you play another mood, you may put a card from the discard pile on the bottom of the deck. If you do,
  draw a card.
status: idea
reprint_of: null
impl_tier: 1
designer: Dr Potato
notes: >-
  Contributor suggestion; the name is a placeholder. Proposed blue build-around (U-M01): recycle the discard pile and play many
  moods, each play drawing a card (see Q5). Wording fixes from the submission: "each time" instead of "whenever" (Scorn, Validation,
  Duplicity), "a card" instead of "a mood" for something in the discard pile, and "on the bottom of the deck". Decided: value 2 (the
  submission offered 3 or 2), in line with the trigger mythics Scorn 2, Validation 1, Duplicity 0. It bends the pool's rule that a
  draw is paid from your own hand or board (Hate, Zeal, Doubt, Paranoia): here the cost is a discard-pile card that belongs to no
  one. The restriction is built in: the discard pile is a depleting resource, so it does nothing with an empty pile, and each use
  shrinks the pile (which affects Sadness, Misery, Melancholy, Grace, Angst, Altruism). Optional safety valve if playtests show
  abuse: "once each turn". The simulator runs these reactions last, after the played mood's after-playing effect, so cards it
  sends to the discard pile are available as fuel. Combos: extra-play engines and Resurgence's replays each trigger a draw (Restraint
  shuts most of that off). impl_tier 1 is provisional: the reaction timing, bottom-of-deck and draw all exist; choosing which pile
  card to bottom must be submitted with the play's choices, like Scorn's target.
