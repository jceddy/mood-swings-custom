rules_text: >-
  After playing this mood, choose an opponent. If that player has one or more cards in their hand, they may reveal
  their hand. If they do, choose a card from it and put it into your hand, and you may play it as an additional
  mood this turn. Otherwise, that player chooses one of their highest value moods and puts it into the discard pile.
status: idea
