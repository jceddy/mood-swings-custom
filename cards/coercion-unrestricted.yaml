designer: ""
notes: >-
  Contributor suggestion; the name is a placeholder. Variant B of two (see Q8): any opponent can be targeted, and
  an opponent with an empty hand cannot decline (the "Otherwise" branch applies). Stronger and more reliable than
  variant A, which is the knob to playtest. Not yet assigned to a black mythic slot (B-M01..B-M03). Same
  implementation needs as variant A. The contributors' variant where the opponent does not choose is not
  written up yet.
