notes: >-
  Black uncommon, color sweeper. The name is a placeholder. The original black cards with this role are Contempt and
  Bitterness (color-based sweepers); this one is symmetric over every player's moods of one color, so it is also a risk to
  your own board. "All other moods" keeps the played mood itself safe if black is chosen. Because moods stay in play, boards
  grow, and a color sweeper gets stronger as the game goes on; Unity (five of a color) is a natural target. Value 1 is the
  price. impl_tier 1 is provisional.
