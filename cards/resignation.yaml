notes: >-
  Blue common, high value with a cost. The name is a placeholder. The original cards with this role are Neurosis (blue, 5:
  put one or more of your moods into your hand) and Self-Loathing (black, 6: put one or more of your moods into the discard
  pile). This one pays with a hand card to the bottom of the deck (blue's verb), so the cost is a card, not a board mood. The
  reminder text is parenthetical, as on every printed to-play cost. Playtest worry: a 6 for one card may be too cheap
  compared with Self-Loathing, which costs a mood; if so, lower it to 5. impl_tier 1 is provisional: a to-play cost of a hand
  card to the bottom of the deck.
