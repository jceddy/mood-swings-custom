notes: >-
  Red rare, steal engine. The name is a placeholder. The original cards with this role are Passion (score an opponent's mood
  as though it were yours) and Recklessness (borrow a mood until after scoring); Guile (blue mythic) takes any mood
  permanently for a price. This is a permanent steal every round, limited to cheap moods: "it becomes yours" is Guile's
  wording, and the cap is on value, not on a cost. It mostly hits engines, which are usually printed 0 to 3. Each player has
  one turn per round, so it triggers once per round. It cannot take a mood that is worth more than 1, so it does not touch
  big scorers and works best against engine decks. Playtest worry: a free extra mood every round. It needs targets, so
  opponents can play around it. If it is too strong, restrict it to a value of 0. impl_tier 1 is provisional: Guile's steal
  on a start-of-turn trigger with a value filter.
