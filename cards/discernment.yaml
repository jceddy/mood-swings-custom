notes: >-
  White partner for the numbers axis. The name is a placeholder. Tunes the hand toward one type: you choose the type to cycle
  away. Always 1 for 1, in Doubt's wording ("put them on the bottom of the deck, then draw that many cards"). Uses W-U05's
  deck-hand-flow slot, which the axes plan did not list. impl_tier 1 is provisional: Doubt's cycle with a printed-number
  filter.
  Revised to say "reveal": in paper the cards must be shown to prove they have a number of the chosen type, since they go face-down onto the
  bottom of the deck (Doubt's wording: "reveal any number of cards from your hand and put them on the bottom of the deck, then draw that many
  cards").
