notes: >-
  Black common, high value with a cost. The name is a placeholder. The original cards with this role are Bashfulness (6:
  after scoring, if you won, bottom of the deck and draw) and Self-Loathing (6: put one or more of your moods into the
  discard pile). The cost here is your own card. Suspicion (3, choose any number of players) can already hit every
  player, so this is Suspicion forced onto every player, including you, for a body worth 5 instead of 3; the forced
  self-discard is the price. It fills the discard pile and supports black's hand-pressure axis, and an empty-handed
  player discards nothing. Playtest worry: it is the closest card in the set to a reprint (Suspicion); check that the 5
  is worth the forced discard. impl_tier 1 is provisional.
