notes: >-
  Green uncommon, static conditional value (3 to 6). The name is a placeholder. The original green cards with this role key
  on parity or counts; this one keys on color diversity on your own board. It is checkable in paper by looking at your own
  moods. It is in tension with Kinship and Unity (color concentration), so a deck must choose a direction. Colorless moods
  have no color. impl_tier 1 is provisional: a color count over your own moods.
