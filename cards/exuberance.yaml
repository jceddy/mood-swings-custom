notes: >-
  Red partner for the playing-red-moods axis (design/axes.md). The name is a placeholder. A Determination-style conditional
  ("three or more moods that share a color") keyed to your own red moods only, so it is harder to turn on than Determination
  (any player's moods, any color) and 6 is fair. Red moods played become Dominance's reach and trigger it, so a red deck
  wants plenty of them. impl_tier 1 is provisional: a color count restricted to your moods.
