notes: >-
  Green uncommon, re-roled from a scoring modifier to a cheap-mood scoring modifier. The name is a placeholder. The
  original cards with this role are Enthusiasm (score one of your moods an extra time, 0 points) and Exhilaration (red
  mythic: score all your moods an extra time, with a sacrifice to play). This one scores every mood of yours with a
  value of 2 or less an extra time, so it rewards wide boards of small moods (Wildfire and Humility pull the same way)
  and does nothing for a 0 or a big mood. It is static, so nothing prompts anyone in async play. It is the closest card
  to an original (Exhilaration at lower rarity). Playtest worry: it needs 1s and 2s on the board; the fallback is a
  threshold of 3 or less. impl_tier 1 is provisional: the scoring hooks Enthusiasm and Exhilaration already use, with a
  value filter.
