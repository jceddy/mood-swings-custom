notes: >-
  Green uncommon, re-roled from a scoring modifier to a cheap-mood scoring modifier. The name is a placeholder. The
  original cards with this role are Enthusiasm (score one of your moods an extra time, 0 points) and Exhilaration (red
  mythic: score all your moods an extra time, with a sacrifice to play). This one scores every mood of yours with a 0, 1
  or 2 in its top right corner an extra time, so it rewards wide boards of small moods (Wildfire and Humility pull the
  same way). It reads the printed number, not the current value, as the group asked: the number in the corner is always
  visible, so paper never has to recompute a value, and suppression or temporary changes do not turn it on or off.
  Wording follows Humility's "a 0, 1, or 2 in its top right corner". Including 0 matters: moods that print a 0 but grow,
  such as Growth, Vindication (printed 2) and Euphoria, score their full current value twice, so they are the best
  targets. It is static, so nothing prompts anyone in async play. History: it first looked at the current value ("with a
  value of 2 or less"), and was changed to the printed number after a group discussion. Dr Potato's Cooperation (green
  uncommon, 0 points: score your two lowest value moods, other than this one, an extra time) was considered for the slot
  and nearly duplicated this card, so this card was kept and the submission was not written. It is the closest card to
  an original (Exhilaration at lower rarity). Playtest worry: it needs printed 1s and 2s on the board; the fallback is a
  printed number of 3 or less. impl_tier 1 is provisional: the scoring hooks Enthusiasm and Exhilaration already use,
  with a filter on the printed value.
