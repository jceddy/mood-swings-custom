notes: >-
  White uncommon, flex (protection). The name is a placeholder. There is no protection card in the original pool; white's
  pool verbs are suppress and play gates, and a shield fits its rules role. It stops targeted effects (for example Barter,
  Plunder, Guile or a Vengeance-style choice) from picking your cheap moods, which is where engines sit (printed 0 to 3). It
  does not stop sweeps (Rage, Intuition, Reckoning) or effects where the owner chooses their own mood (Arrogance, Fury), so
  it is a narrow shield. The value of 2 means it protects itself. "Value" is the current value. Playtest worry: engine decks
  may become too hard to attack with targeted effects; if so, lower the threshold to 1 or less. impl_tier 2 is provisional: a
  "can't be chosen" filter on opponents' target choices.
