notes: >-
  Red uncommon, re-roled from a steal-and-return loan to retaliation. The name is a placeholder. The original card with
  this role is Arrogance (an opponent chooses a white or blue mood and it becomes yours until this mood leaves); every
  variant was Arrogance with the color restriction removed or Recklessness. Plunder (R-R01) already covers steals. This
  one answers removal: when an opponent's effect puts your mood into the discard pile, you remove a cheap mood back.
  Sweeps count (Intuition, Reckoning, Bullying) as well as targeted removal. It does not trigger on your own sacrifices.
  Wording follows Shock's threshold. Playtest worry: it needs the simulator to know which player controls the effect
  that moved a mood; Legacy (B-U04) uses a similar hook for any cause. impl_tier 2 is provisional.
