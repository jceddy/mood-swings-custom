slot: U-M01
name: Reverie
color: blue
rarity: mythic
base_value: 2
alt_value: null
to_play: false
while_in_play: true
after_playing: true
rules_text: >-
  After playing this mood — You may put a card from the discard pile on the bottom of the deck. If you do, draw a card.
  While in play — Each time you play another mood, you may do this.
status: idea
reprint_of: null
impl_tier: 1
designer: Dr Potato
notes: >-
  Contributor suggestion; the name is a placeholder. Proposed blue build-around (U-M01): recycle the discard pile and play many
  moods, each play drawing a card (see Q5). Decided: it also triggers on its own play (Dr Potato's request), written as an after-playing sentence plus the
  while-in-play trigger rather than "including this one", because the simulator's reaction step skips the played mood itself and
  its list of reactors is a snapshot from before the play, so a self-trigger would need an engine change; the two-timing form
  needs none. "You may do this" means the whole put-then-draw cycle, as with Rapport's "a second time". It now always gets one
  activation on entry when the discard pile has a card, which softens the early-round "empty pile does nothing" restriction.
  Wording fixes from the original submission: "each time" instead of "whenever" (Scorn, Validation,
  Duplicity), "a card" instead of "a mood" for something in the discard pile, and "on the bottom of the deck". Decided: value 2 (the
  submission offered 3 or 2), in line with the trigger mythics Scorn 2, Validation 1, Duplicity 0. It bends the pool's rule that a
  draw is paid from your own hand or board (Hate, Zeal, Doubt, Paranoia): here the cost is a discard-pile card that belongs to no
  one. The restriction is built in: the discard pile is a depleting resource, so it does nothing with an empty pile, and each use
  shrinks the pile (which affects Sadness, Misery, Melancholy, Grace, Angst, Altruism). Optional safety valve if playtests show
  abuse: "once each turn". The simulator runs these reactions last, after the played mood's after-playing effect, so cards it
  sends to the discard pile are available as fuel. Combos: extra-play engines and Reinvigoration's replays each trigger a draw (Restraint
  shuts most of that off). impl_tier 1 is provisional: the reaction timing, bottom-of-deck and draw all exist; choosing which pile
  card to bottom must be submitted with the play's choices, like Scorn's target.
