rules_text: >-
  To play this card, discard a card from your hand. (If you can't do that, you can't play this card.) While in play,
  at the start of each of your turns, you may discard a card from your hand. If you don't, put this mood into the
  discard pile.
status: idea
reprint_of: null
impl_tier: 1
designer: jceddy
notes: >-
  Older community design; "FOMO" (Fear of Missing Out) is a working title. The pool names cards with single emotion words,
  and "Fear of Missing Out" would sit close to the reprint candidate Fear, so a rename is possible later. Wording follows
  Bliss (to-play discard cost) and Stubbornness (start-of-turn trigger). The sentence "If you can't do that, you can't play this
  card" is parenthetical reminder text, as on the printed cards (Bliss, Envy, Guile, Exhilaration); the simulator's transcription
  of those cards lost the parentheses, so the baseline shows it as plain text. Any other to-play cost added to the set should
  use the same reminder-text form. Value 7 would be the highest unconditional printed
  value in the original pool (the next are the 6s); playtest 7 against 6. Power Ratio idea: it is 7 only while the upkeep
  is paid. The to-play cost plus a recurring cost means two ability timings, so it sits at rare. Moods stay in play after rounds are scored, so
  the upkeep is paid every turn for the rest of the game, not just for the round; how the hand refills is still unverified. impl_tier 1 is provisional: the
  simulator already has a start-of-turn trigger (Stubbornness); the optional pay-or-lose-it prompt is the only new part.
  Interacts with hand discard (Suspicion) and with Schadenfreude.
