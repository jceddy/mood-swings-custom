notes: >-
  White partner for the numbers axis (design/axes.md). The name is a placeholder. A common extra play restricted by matching
  numbers, worded like Eagerness (green uncommon: an additional mood if it shares a color with one of your moods) with
  Friendliness and Kindness's "in its top right corner". It rewards stacking one value. Because 3 is the modal printed value
  it is easy to enable, which is the main thing to watch. One of three white extra-play partners (with Modesty and
  Confidence); Restraint (W-M02) shuts them all off, which is a deliberate tension. impl_tier 1 is provisional: an extra-play
  grant with a printed-number check.
