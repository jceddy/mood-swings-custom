notes: >-
  Blue uncommon, re-roled from color-based mass bounce to a value-threshold bounce. The name is a placeholder. The
  original cards with this role are Hesitation (bounce red and green moods) and Fickleness (bounce the most common
  color), which bounce by color, and Disorientation (blue 0: bounce every other mood with one chosen value). This one
  bounces every other mood with a value of 4 or more, from every player, so it is the high-value mirror of Rage (red:
  put all other moods with a value of 3 or less into the discard pile) with blue's verb; wording follows Rage ("you may
  put all other moods") and Disorientation ("into their players' hands"). Bouncing costs each owner a play to replay
  each mood. History: it first hit one chosen player only; the group called it a really strong card, because the base
  game has no one-sided mass sweeper (every original "put all" or "suppress all" card hits every player, and the
  asymmetry comes from deck building). It is symmetric now, so you build it into low-value decks and keep big moods off
  the table. Closest original: Disorientation (a single chosen value, at 0); Chagrin hits every value of 4 or more at
  once and costs 2. Playtest worry: it is the same shape as Rage on the high side, so check that the two do not make big
  moods unplayable. impl_tier 1 is provisional: a threshold filter on all other moods plus a bounce.
