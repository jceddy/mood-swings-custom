notes: >-
  Colorless uncommon, a payoff for colorless moods. The name is a placeholder. The original pool has no colorless moods
  other than the vanilla commons, so there was no colorless payoff; Emptiness (X-U01) counts colors among all moods
  instead. The set's colorless moods are the five gate commons (value 5 each), Emptiness and Unity, so it grows with the
  gates and rewards a deck that plays several. Printed values are 5, so each gate mood adds 2 on top of its own 5.
  Playtest worry: it needs colorless moods to be in the deck, and the gate commons require a mood of a color to be
  played. impl_tier 1 is provisional: a count of moods without a color. The "(Moods are cards in play.)" reminder was
  added in the clone check, because it counts moods, as Restlessness and Unity do.
