notes: >-
  White common, conditional (3 to 5). The name is a placeholder. The original card with this role is Chivalry (5 if you
  didn't go first this round). Hand sizes are public, so the condition is checkable in paper, and cards in hand are a scarce
  resource (hands refill only through round losses and card effects), so it is a meaningful condition. It rewards the player
  with the smallest hand, the opposite of Anticipation (blue). The wording is Superiority's template ("more moods than each
  other player") applied to cards in hand. Ties do not count. Playtest worry: players run their hands down, so the condition
  may be true too often; it is priced at 5, not 6. impl_tier 1 is provisional: a hand-size comparison against each other
  player.
