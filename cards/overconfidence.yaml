notes: >-
  Blue uncommon, re-roled from a second hand-manipulation effect to a tempo shift. The name is a placeholder. The
  original pool has no card that borrows plays from the future; Joy banks a play for the next turn, and this is the
  reverse. You get three plays this turn and none next turn (two plays over two turns normally, so it is a net gain of
  one in exchange for a gap). It fits the blue and red axes that want many plays in one turn (Reverie, Dominance,
  Verve). It does not stop Hurt Feelings' second base play, which is a round attribute. Playtest worry: three plays
  in one turn is a large burst, and the lost turn may be too easy to afford late in a round you are already winning.
  impl_tier 2 is provisional: a one-turn play ban on yourself that is set when the extra plays are used.
  The word next is bold in the MSE set, as in the printed Joy (on your next turn).
