notes: >-
  White rare, re-roled from a generic play-grant engine to a numbers play engine. The name is a placeholder. It is
  Familiarity (W-C04, a one-shot extra play if the extra mood matches a number you have) turned into an engine, and it
  fits white's numbers axis. The cap of once each turn follows Adrenaline (R-R04, "the first time you play a red mood
  each turn") so a deck full of duplicates cannot chain forever; the optional choice is on your own turn, so it never
  prompts another player in async play. Resonance is one more free-play enabler (see Q9), and the free-play cycle (Fear,
  Nostalgia, Levity, Remorse, Rashness) stacks with it. Restraint, Counterplay and Interruption answer it. Playtest
  worry: decks with many cards of the same number get a free extra play every turn. impl_tier 1 is provisional: a number
  match against your other moods, on the same hook as Adrenaline.
