rules_text: >-
  After playing this mood — Choose an opponent. While in play — During each of your turns (including the turn you play
  this mood), you may play an additional mood for each round the chosen player has won. While in play — If this mood
  would leave play, put it on the bottom of the deck instead. (Leaving play includes being put into the discard pile or
  into a player's hand.)
