designer: Dr Potato
notes: >-
  Contributor suggestion. The submission read "APtM: if you control 5 or more moods of the same color, when scoring this round,
  you win the round." Decided: option A, a while-in-play condition checked at scoring, not a one-time check when played; it is
  stateless and gives opponents turns to react. Wording: "have" instead of "control", "that share a color" as in Determination,
  numbers as words, and "after scoring ... win the round" following Sneakiness (its effect happens after scoring and before
  determining who wins). Placed in the colorless rare slot X-R01 because the skeleton has no colorless mythic slot; a new slot
  would make the set 134 cards and reopen Q2. Moods stay in play after rounds are scored, so this gets stronger as the game
  progresses: a mono-color deck gets closer to five moods every round, which makes it a late-game win condition and the main
  playtest worry (levers: a threshold of six, or a different count). Unity is colorless, so it does not count toward its own
  five (six moods in total). Suppressed moods still count (the ruling made for the colorless gates). Imagination makes every
  mood share a color, so five moods in total with Imagination in play would win the round. Awe ("no one wins or loses this
  round") should override it. Open rulings: what happens when two players both have Unity and qualify (a tie-break), and
  the usual round consequences should follow a Unity win, since it makes you the round's winner: the losing players draw a card at
  the end of the round (Hurt Feelings still to confirm). Extra plays help reach five faster, so
  it is a payoff for the red, blue and green extra-play axes; Restraint counters it. impl_tier 2: the colorless color value
  (Q6) and overriding who wins the round are new; Sneakiness already modifies scores before the winner is determined.
