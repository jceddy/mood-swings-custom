notes: >-
  Green uncommon, third static conditional, keyed on discard pile size. The name is a placeholder. The original card
  with a similar condition is Misery (black: 8 if two or more cards in the discard pile share a color). This one is a
  plain count of cards in the pile, and it fits green's pile axis (Reinvigoration, Thrift, Resilience) since sweepers and
  sacrifices fill it. It is in tension with green's own replays, which empty the pile, so a deck has to choose. The pile
  is face up, so the count is public. The first threshold was five cards, and in the play tests (games 533 to 545) the pile held at most three cards
  at the end of every game, so it was never a 6; it is now three (Q13, decided). Playtest worry: it may now be on almost
  always after the midgame; the fallbacks are four, then back to five. impl_tier 1 is provisional: a count of cards in
  the discard pile.
