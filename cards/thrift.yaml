notes: >-
  Green partner for the replay axis (also useful in red). The name is a placeholder. Harmony (green uncommon 2: an additional
  mood from the discard pile) restricted to cheap moods, which are the best targets for re-triggering after-playing text.
  Number wording follows Dignity ("a 0, 1, 2, or 3 in its top right corner"). Restraint shuts it off. impl_tier 1 is
  provisional: Harmony's grant with a printed-number filter.
  Value 3, not 2 (group decision after review): Harmony (green uncommon 2) is the unrestricted original, so this narrower
  version gets a higher body to compensate, the same logic as the cycle pass (a weaker effect should not print low).
