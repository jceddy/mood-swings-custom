notes: >-
  Black uncommon, re-roled from a second color sweeper to a death trigger. The name is a placeholder. Black already has
  three color sweepers' worth of ideas (Contempt, Bitterness, Atonement), and every further one was a clone. The
  original pool has no card that reacts to your moods leaving play. This one is a card for each of your moods that is
  put into the discard pile, from any cause (Martyrdom, Bravado, Vindictiveness, opponents' removal), so it is one for one:
  a mood for a card. It rewards sacrifice decks and softens removal. The draw is mandatory, not a "you may", because it
  is always worth taking and a prompt on an opponent's turn is a problem in digital asynchronous play (found when the
  group commented on Defensiveness). Playtest worry: with sacrifice engines (Martyrdom each round) it draws a card every
  round; check that it does not break the draw rule. impl_tier 2 is provisional: a hook for a mood leaving play to the
  discard pile.
