notes: >-
  Blue rare, swap effect. The name is a placeholder. The original card with this role is Avoidance (choose left or right and
  everyone passes a mood around); Instability (red) is the one-for-one trade where the opponent chooses. This one swaps one
  of your moods for one of an opponent's moods of the same value, so it swaps effects and not score: you hand over a weak or
  harmful mood and take their engine. Many engines print at 0 to 3, so it is a real tool against them. Both moods keep their
  place in play, and neither after-playing effect happens again. "Value" means the current value, which both players can see.
  Playtest worry: it is very strong against opposing engines, and a deck with cheap dead-weight moods always has something to
  give. If it is too strong, require printed values to match. impl_tier 2 is provisional: an ownership swap between two
  chosen moods, with a same-value filter.
