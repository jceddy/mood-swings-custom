notes: >-
  Red partner for the white numbers axis. The name is a placeholder. The skeleton role (numeric sweeper) matches
  Rebellion (red uncommon 2: choose 0, 1, 2, or 3 and put all other moods with the chosen value into the discard pile).
  This version hits every player, including you, and lets you name any number, with Rebellion's "all other moods"
  wording so the played mood is safe. It is printed at 1, a point lighter than Rebellion. History: it first hit only
  your opponents and printed at 2, which the group judged a strict upgrade over Rebellion; it then printed at 1 as a
  one-sided sweep; the group chose to make it symmetric and keep it at 1. A single-target version was rejected because
  printed values are public, so the number choice would mean nothing. Number wording follows Friendliness, Kindness and
  Validation ("in its top right corner" means the printed value). Playtest worry: any-number reach makes it a superset
  of Rebellion's range, so check that a 1-point body is a fair price. impl_tier 1 is provisional.
