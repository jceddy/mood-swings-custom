notes: >-
  Red partner for the white numbers axis. The name is a placeholder. The skeleton role (numeric sweeper) matches Rebellion
  (red uncommon 2: choose 0, 1, 2, or 3 and put all other moods with the chosen value into the discard pile). This version
  hits only your opponents but lets you name any number, so you have to guess what is on their board (printed numbers are
  visible). Number wording follows Friendliness, Kindness and Validation ("in its top right corner" means the printed value).
  Playtest worry: it is one-sided like Bullying, and stronger than Rebellion because it never hits you. impl_tier 1 is
  provisional.
