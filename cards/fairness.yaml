notes: >-
  White rare, suppress engine. The name is a placeholder. The original cards with this role are Scorn (mythic: a suppression
  each time you play another mood) and Meekness (suppress every mood of value 5 or more while you have it). This is an
  equalizer: each round, the biggest mood stops scoring. It can hit your own mood if that is the highest, so it favors the
  player who is behind. "One of the highest value moods" is Fury's wording ("one of their highest value moods") and "until
  the end of this round" is Scorn's. Playtest worry: it blunts Unity and big scaling bodies but also your own Frenzy and
  FOMO. impl_tier 1 is provisional: a start-of-turn trigger and a suppress until end of round exist.
