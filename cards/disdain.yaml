notes: >-
  Enemy cycle (slot C02), black. The name is a placeholder. Replaces the original value-swapping Disgust. Black's enemies are
  white and green; counting follows the original wheel (any player's moods, the two colors combined). Uses black's own pie
  verb: removal to the discard pile, worded as in Contempt ("put a green or white mood into the discard pile"). It is a weaker
  common cousin of Contempt, gated by the 2+ count. "May" because the chosen mood can be your own, and a forced self-removal
  would be unfair. Black would then have two removal commons next to B-C03 (interaction-lite) and Spite; keep B-C03 the only
  broad one. impl_tier 1 is provisional: a color count plus an existing removal-to-the-discard-pile effect.
